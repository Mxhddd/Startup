# Parent app (v8): the home sheet, then the menu: help, and the delete-account sheet (not confirmed).
# Works without a server. Run: maestro test tests/maestro/parent-family.yaml
appId: pk.pohnch.parent
---
- launchApp
- assertVisible:
    id: "trip-sheet"
- tapOn: "مینو"
- assertVisible: "بچے"
- tapOn:
    id: "menu-help"
- assertVisible:
    id: "help-whatsapp"
- tapOn: "بند کریں"
- tapOn:
    id: "menu-delete"
- assertVisible:
    id: "delete-confirm"
- assertVisible: "اکاؤنٹ ختم کریں؟"
