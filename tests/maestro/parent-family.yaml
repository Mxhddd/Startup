# Parent app: the home sheet, then the menu with family members, add a child and join a van.
appId: pk.pohnch.parent
---
- launchApp
- assertVisible:
    id: "trip-sheet"
- tapOn: "مینو"
- assertVisible:
    id: "family-phone"
- inputText: "021 345"
- tapOn:
    id: "family-add"
- assertVisible: "یہ موبائل نمبر درست نہیں۔ 03 سے شروع ہونے والا نمبر لکھیں۔"
