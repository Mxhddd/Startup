<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div dir="rtl" aria-busy="true" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF8F3; color: #121212; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" data-state="loading" style="background: #FFFFFF; border-bottom: 2px solid #121212; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 20px; font-weight: 700">صبح کا چکر</span>
        <span style="font-size: 14px; color: #3A3A3A; font-weight: 600">گلشن وین · منگل 27 اکتوبر</span>
      </div>
      <span style="width: 48px; height: 36px; border-radius: 8px; background: #E4E0D6"></span>
    </div>
    <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #E4E0D6"></div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px">
    <div role="status" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 104px; border-radius: 18px; background: #E4E0D6; font-size: 18px; font-weight: 700">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg>
      آج کی فہرست آ رہی ہے
    </div>
    <span style="height: 60px; border-radius: 12px; background: #EEEBE4"></span>
    <span style="height: 60px; border-radius: 12px; background: #EEEBE4"></span>
    <span style="height: 60px; border-radius: 12px; background: #EEEBE4"></span>
    <span style="height: 60px; border-radius: 12px; background: #EEEBE4"></span>
    <span style="height: 60px; border-radius: 12px; background: #EEEBE4"></span>
    <span style="margin-top: auto; font-size: 15px; font-weight: 600; text-align: center">سگنل کمزور ہو تو کل والی فہرست فوراً دکھا دیں گے اور ٹیپ محفوظ رہیں گے</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
