<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver before trip v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #1F2A5C; color: #FAF6EE; padding: 14px 16px; border-bottom: 5px solid #E8A33D; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 21px; font-weight: 800">صبح کا چکر</span><span style="font-size: 14px; font-weight: 600">گلشن وین · بدھ 28 اکتوبر</span></div>
      <span style="font-size: 28px; font-weight: 800; line-height: 1">0/5</span>
      <a href="XD-Help.dc.html" style="height: 52px; padding: 0 14px; border-radius: 14px; background: #FAF6EE; color: #1F2A5C; text-decoration: none; display: flex; align-items: center; font-size: 16px; font-weight: 800">مدد</a>
    </div>
    <div data-component="RouteDots" aria-hidden="true" style="display: flex; align-items: center; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="width: 16px; height: 16px; border-radius: 50%; border: 3px solid #FAF6EE; box-sizing: border-box; flex: none"></span><span style="flex: 1; border-top: 3px dotted #FAF6EE"></span></sc-for>
      <svg width="28" height="28" viewBox="0 0 64 64" style="flex: none"><path d="{{S}}" fill="#E8A33D"></path></svg>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px 14px">
    <span data-component="AbsentChip" style="align-self: flex-start; display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; background: #EEE9DF; color: #5E5A52; font-size: 16px; font-weight: 800; box-shadow: inset 0 0 0 1.5px #5E5A52">مریم · آج چھٹی</span>
    <a href="XD-MidRoute.dc.html" data-component="TapButton" data-step="left" data-hold="true" style="display: flex; align-items: center; gap: 14px; height: 112px; padding: 0 18px; border-radius: 20px; background: #1F2A5C; color: #FAF6EE; text-decoration: none; box-shadow: 0 5px 0 #0E1430">
      <span style="width: 62px; height: 62px; border-radius: 16px; background: #FAF6EE; display: flex; align-items: center; justify-content: center; flex: none"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1F2A5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16V7a1 1 0 0 1 1-1h11l4 4h2a2 2 0 0 1 2 2v4 M9 17h6 M5 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M15 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 28px; font-weight: 800">نکل گئے</span><span style="font-size: 16px; font-weight: 700">دبا کر رکھیں · سب والدین کو خبر</span></span>
    </a>
    <span style="font-size: 15px; font-weight: 800; padding: 0 4px">اسٹاپ کی ترتیب</span>
    <sc-for list="{{kids}}" as="k" hint-placeholder-count="5">
      <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: #FFFFFF; border-radius: 14px; box-shadow: inset 0 0 0 1px #E2DCCD">
        <span style="width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px #141A33; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">{{k.n}}</span>
        <span style="flex: 1; font-size: 19px; font-weight: 700">{{k.name}}</span>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      S: 'M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z',
      dots: [1, 2, 3, 4, 5],
      kids: [{ n: 1, name: 'علی' }, { n: 2, name: 'فاطمہ' }, { n: 3, name: 'حمزہ' }, { n: 4, name: 'عائشہ' }, { n: 5, name: 'زین' }]
    };
  }
}
</script>
</body>
</html>
