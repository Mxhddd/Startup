<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver before morning trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF8F3; color: #121212; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #FFFFFF; border-bottom: 2px solid #121212; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 20px; font-weight: 700">صبح کا چکر</span>
        <span style="font-size: 14px; color: #3A3A3A; font-weight: 600">گلشن وین · منگل 27 اکتوبر</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 26px; font-weight: 800; line-height: 1.2">0/5</span>
        <span style="font-size: 14px; font-weight: 600">بیٹھ گئے</span>
      </div>
    </div>
    <div aria-hidden="true" style="display: flex; gap: 4px; height: 8px">
      <span style="flex: 1; border-radius: 4px; background: #D6D2C8"></span>
      <span style="flex: 1; border-radius: 4px; background: #D6D2C8"></span>
      <span style="flex: 1; border-radius: 4px; background: #D6D2C8"></span>
      <span style="flex: 1; border-radius: 4px; background: #D6D2C8"></span>
      <span style="flex: 1; border-radius: 4px; background: #D6D2C8"></span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px">
    <div data-component="ChildRow" data-state="absent" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 10px 0 14px; background: #EEEBE4; border: 2px dashed #8A857A; border-radius: 12px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #4D4D4D; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #4D4D4D; box-sizing: border-box">6</span>
      <span style="flex: 1; font-size: 18px; font-weight: 700; color: #4D4D4D">مریم</span>
      <span data-component="AbsentChip" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #4D4D4D; color: #FFFFFF; font-size: 15px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><path d="m10 13 4 4M14 13l-4 4"></path></svg>
        آج چھٹی
      </span>
    </div>

    <a href="D3-MidRoute.dc.html" data-component="TapButton" data-step="left" data-size="next" style="display: flex; align-items: center; gap: 14px; height: 104px; padding: 0 16px; border-radius: 18px; background: #1F4FD1; color: #FFFFFF; text-decoration: none; box-shadow: 0 4px 0 #12318A">
      <span style="width: 60px; height: 60px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1F4FD1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16V7a1 1 0 0 1 1-1h11l4 4h2a2 2 0 0 1 2 2v4"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle><path d="M9 17h6"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.6">
        <span style="font-size: 28px; font-weight: 700">نکل گئے</span>
        <span style="font-size: 16px; font-weight: 600">سب والدین کو اطلاع جائے گی</span>
      </span>
    </a>

    <span style="font-size: 15px; font-weight: 700; padding: 2px 4px 0">اسٹاپ کی ترتیب</span>

    <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; background: #FFFFFF; border: 2px solid #D6D2C8; border-radius: 12px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #121212; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; box-sizing: border-box">1</span>
      <span style="flex: 1; font-size: 19px; font-weight: 700">علی</span>
    </div>
    <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; background: #FFFFFF; border: 2px solid #D6D2C8; border-radius: 12px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #121212; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; box-sizing: border-box">2</span>
      <span style="flex: 1; font-size: 19px; font-weight: 700">فاطمہ</span>
    </div>
    <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; background: #FFFFFF; border: 2px solid #D6D2C8; border-radius: 12px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #121212; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; box-sizing: border-box">3</span>
      <span style="flex: 1; font-size: 19px; font-weight: 700">حمزہ</span>
    </div>
    <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; background: #FFFFFF; border: 2px solid #D6D2C8; border-radius: 12px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #121212; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; box-sizing: border-box">4</span>
      <span style="flex: 1; font-size: 19px; font-weight: 700">عائشہ</span>
    </div>
    <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; background: #FFFFFF; border: 2px solid #D6D2C8; border-radius: 12px">
      <span style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid #121212; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; box-sizing: border-box">5</span>
      <span style="flex: 1; font-size: 19px; font-weight: 700">زین</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
