<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver before trip v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5C5A}a:hover{color:#123C3B}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #F6EFE2; color: #1B2525; font-family: Nunito, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #1E5C5A; color: #F6EFE2; border-radius: 0 0 28px 28px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.7"><span style="font-size: 21px; font-weight: 700">صبح کا چکر</span><span style="font-size: 14px; font-weight: 600">گلشن وین · منگل 27 اکتوبر</span></div>
      <span style="font-size: 28px; font-weight: 900; line-height: 1">0/5</span>
      <a href="V-D-Safety.dc.html" style="height: 52px; padding: 0 14px; border-radius: 18px; background: #F6EFE2; color: #1E5C5A; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>مدد</a>
    </div>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
        <span style="width: 16px; height: 16px; border-radius: 50%; border: 3px solid #F6EFE2; box-sizing: border-box; flex: none"></span>
        <span style="flex: 1; border-top: 3px dotted #F6EFE2"></span>
      </sc-for>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18 M5 21V10l7-4 7 4v11 M10 21v-5h4v5"></path></svg></span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 14px">
    <div data-component="ChildRow" data-state="absent" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 12px 0 16px; background: #EDE3D0; border-radius: 18px">
      <span style="flex: 1; font-size: 18px; font-weight: 700; color: #5C5348">مریم</span>
      <span data-component="AbsentChip" style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; background: #5C5348; color: #FFFFFF; font-size: 15px; font-weight: 700">آج چھٹی</span>
    </div>

    <a href="V-D-Hold.dc.html" data-component="TapButton" data-step="left" data-hold="true" style="display: flex; align-items: center; gap: 14px; height: 110px; padding: 0 18px; border-radius: 26px; background: #2747B8; color: #FFFFFF; text-decoration: none; box-shadow: 0 5px 0 #1A3486">
      <span style="width: 62px; height: 62px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#2747B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16V7a1 1 0 0 1 1-1h11l4 4h2a2 2 0 0 1 2 2v4 M9 17h6 M5 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M15 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 28px; font-weight: 700">نکل گئے</span><span style="font-size: 16px; font-weight: 700">دبا کر رکھیں · سب والدین کو خبر</span></span>
    </a>

    <span style="font-size: 15px; font-weight: 700; padding: 0 4px">اسٹاپ کی ترتیب</span>
    <sc-for list="{{kids}}" as="k" hint-placeholder-count="5">
      <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: #FFFBF3; border-radius: 18px">
        <span style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid #1B2525; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; box-sizing: border-box">{{k.n}}</span>
        <span style="flex: 1; font-size: 19px; font-weight: 700">{{k.name}}</span>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dots: [1, 2, 3, 4, 5],
      kids: [{ n: 1, name: 'علی' }, { n: 2, name: 'فاطمہ' }, { n: 3, name: 'حمزہ' }, { n: 4, name: 'عائشہ' }, { n: 5, name: 'زین' }]
    };
  }
}
</script>
</body>
</html>
