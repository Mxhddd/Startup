<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Saaf parent timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF8F3; color: #121212; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" data-role="parent" style="background: #FFFFFF; border-bottom: 2px solid #121212; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 20px; font-weight: 700">علی · صبح کا چکر</span>
      <span style="font-size: 14px; color: #3A3A3A; font-weight: 600">گلشن وین · ڈرائیور رفیق بھائی</span>
    </div>
    <span style="font-size: 14px; font-weight: 700; padding: 0 10px; border: 2px solid #121212; border-radius: 999px">منگل</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 16px">
    <section style="background: #0E7A3E; color: #FFFFFF; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E7A3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-1a6 6 0 0 1 6-6h3"></path><path d="m14.5 18 2.5 2.5 5-5"></path></svg>
        </span>
        <span style="font-size: 26px; font-weight: 700; line-height: 1.7">علی وین میں ہے</span>
      </div>
      <span style="font-size: 16px; font-weight: 600">7:12 بجے · ڈرائیور نے مارک کیا</span>
    </section>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
      <li data-component="TimelineEvent" data-step="left" style="display: flex; gap: 12px; min-height: 64px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 36px">
          <span style="width: 36px; height: 36px; border-radius: 50%; background: #1F4FD1; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16V7a1 1 0 0 1 1-1h11l4 4h2a2 2 0 0 1 2 2v4"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle><path d="M9 17h6"></path></svg></span>
          <span style="flex: 1; width: 3px; background: #121212"></span>
        </div>
        <div style="flex: 1; display: flex; justify-content: space-between; padding-top: 0">
          <span style="font-size: 18px; font-weight: 700">وین نکل گئی</span>
          <span style="font-size: 16px; font-weight: 700">7:05</span>
        </div>
      </li>
      <li data-component="TimelineEvent" data-step="picked" data-current="true" style="display: flex; gap: 12px; min-height: 64px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 36px">
          <span style="width: 36px; height: 36px; border-radius: 50%; background: #0E7A3E; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: 0 0 0 4px #CFE8D9"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-1a6 6 0 0 1 6-6h3"></path><path d="m14.5 18 2.5 2.5 5-5"></path></svg></span>
          <span style="flex: 1; width: 3px; background: repeating-linear-gradient(#121212 0 4px, transparent 4px 9px)"></span>
        </div>
        <div style="flex: 1; display: flex; justify-content: space-between">
          <span style="font-size: 18px; font-weight: 700">علی وین میں ہے</span>
          <span style="font-size: 16px; font-weight: 700">7:12</span>
        </div>
      </li>
      <li data-component="TimelineEvent" data-step="reached_school" data-state="upcoming" style="display: flex; gap: 12px; min-height: 52px">
        <div style="display: flex; flex-direction: column; align-items: center; width: 36px">
          <span style="width: 36px; height: 36px; border-radius: 50%; border: 2px dashed #3A3A3A; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A3A3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V10l7-4 7 4v11"></path><path d="M10 21v-5h4v5"></path></svg></span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column">
          <span style="font-size: 18px; font-weight: 600; color: #3A3A3A">اسکول پہنچنا</span>
          <span style="font-size: 14px; font-weight: 600; color: #3A3A3A">ابھی نہیں</span>
        </div>
      </li>
    </ol>

    <button style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border: 2px solid #121212; border-radius: 14px; background: #FFFFFF; color: #121212; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><path d="m10 13 4 4M14 13l-4 4"></path></svg>
      آج چھٹی
    </button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
