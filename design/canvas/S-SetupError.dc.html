<!doctype html>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF8F3; color: #121212; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column; padding: 22px 18px 18px; gap: 16px">
  <span style="font-size: 28px; font-weight: 700; line-height: 1.8">اپنی وین بنائیں</span>

  <form style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="e-driver" style="font-size: 17px; font-weight: 700">ڈرائیور کا پہلا نام</label>
      <input id="e-driver" value="رفیق" style="height: 56px; border-radius: 12px; border: 2px solid #121212; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 19px; font-weight: 600; color: #121212; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="e-school" style="font-size: 17px; font-weight: 700">اسکول کا نام</label>
      <input id="e-school" aria-invalid="true" aria-describedby="e-school-err" value="" style="height: 56px; border-radius: 12px; border: 3px solid #B3261E; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 19px; font-weight: 600; color: #121212; box-sizing: border-box">
      <span id="e-school-err" style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; color: #B3261E">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 16.5v.5"></path></svg>
        اسکول کا نام لکھیں
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="e-time" style="font-size: 17px; font-weight: 700">صبح وین کب نکلتی ہے؟</label>
      <input id="e-time" type="time" value="07:00" dir="ltr" style="height: 56px; border-radius: 12px; border: 2px solid #121212; background: #FFFFFF; padding: 0 14px; font-family: Inter, sans-serif; font-size: 19px; font-weight: 700; color: #121212; box-sizing: border-box; text-align: right">
    </div>
  </form>

  <div role="alert" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #FDECEA; border: 2px solid #B3261E; border-radius: 14px; color: #5C0F0A">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M12 20h.01"></path><path d="M5 12.5a10 10 0 0 1 5.2-2.8"></path></svg>
    <span style="flex: 1; font-size: 15px; font-weight: 700">لنک نہیں بن سکا۔ انٹرنیٹ دیکھ کر دوبارہ دبائیں، آپ کی لکھی چیزیں محفوظ ہیں۔</span>
  </div>
  <button style="height: 64px; border-radius: 16px; border: 0; background: #121212; color: #FFFFFF; font-family: inherit; font-size: 20px; font-weight: 700; cursor: pointer">دوبارہ کوشش کریں</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>

  renderVals() {
    return {};
  }

</body>
</html>
