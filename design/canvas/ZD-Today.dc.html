<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver today and start trip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.stop{display:flex;align-items:center;gap:10px;min-height:46px;font-size:17px;font-weight:700;border-bottom:1px solid #F0EBE0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.5; display: flex; flex-direction: column">
  <header style="background: #1F2A5C; color: #FAF6EE; padding: 16px 16px 14px; display: flex; align-items: center; gap: 10px">
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.35"><span style="font-size: 22px; font-weight: 800">السلام علیکم، رفیق بھائی</span><span style="font-size: 14px; font-weight: 600">جمعرات 29 اکتوبر · گلشن وین</span></span>
    <a href="ZD-Earnings.dc.html" style="height: 44px; padding: 0 12px; border-radius: 12px; background: #E8A33D; color: #141A33; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800">2 نئی درخواستیں</a>
  </header>
  <div style="height: 250px; position: relative; flex: none">
    <svg width="390" height="250" viewBox="0 0 390 250" aria-label="آج کا راستہ اور اسٹاپ" style="position: absolute; inset: 0">
      <rect width="390" height="250" fill="#EFE9DC"></rect>
      <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"><path d="M0 70 H390"></path><path d="M0 180 H390"></path><path d="M110 0 V250"></path><path d="M280 0 V250"></path></g>
      <path d="M350 220 C300 200 280 170 250 150 C210 124 160 130 130 100 C110 80 90 50 60 30" fill="none" stroke="#1F2A5C" stroke-width="7" stroke-linecap="round"></path>
      <g fill="#FFFFFF" stroke="#1F2A5C" stroke-width="4"><circle cx="300" cy="196" r="9"></circle><circle cx="250" cy="150" r="9"></circle><circle cx="190" cy="126" r="9"></circle><circle cx="130" cy="100" r="9"></circle></g>
      <g transform="translate(60 30)"><circle r="16" fill="#E8A33D" stroke="#FFFFFF" stroke-width="3"></circle></g>
      <g transform="translate(350 220)"><path d="M0 -18 L13 12 L0 5 L-13 12 Z" fill="#1F2A5C" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"></path></g>
    </svg>
  </div>
  <main style="flex: 1; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 15px; font-weight: 800; color: #4A4F66">آج 6 بچے · 1 چھٹی</span>
    <div style="background: #FFFFFF; border-radius: 16px; box-shadow: inset 0 0 0 1px #E2DCCD; padding: 0 14px">
      <div class="stop"><span style="width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px #141A33; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">1</span><span style="flex: 1">علی</span><span dir="ltr" style="font-size: 15px">7:12</span></div>
      <div class="stop"><span style="width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px #141A33; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">2</span><span style="flex: 1">فاطمہ</span><span dir="ltr" style="font-size: 15px">7:18</span></div>
      <div class="stop"><span style="width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 2px #141A33; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">3</span><span style="flex: 1">حمزہ اور عائشہ · ایک گھر</span><span dir="ltr" style="font-size: 15px">7:24</span></div>
      <div class="stop" style="border-bottom: 0"><span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #EEE9DF; color: #5E5A52; box-shadow: inset 0 0 0 1.5px #5E5A52; display: flex; align-items: center; font-size: 15px; font-weight: 800">سارا · آج چھٹی</span></div>
    </div>
    <button onClick="{{go}}" style="margin-top: auto; height: 112px; border: 0; border-radius: 22px; background: {{bg}}; color: #FAF6EE; font-family: inherit; display: flex; align-items: center; gap: 14px; padding: 0 18px; box-shadow: 0 5px 0 #0E1430; cursor: pointer">
      <span style="width: 64px; height: 64px; border-radius: 18px; background: #FAF6EE; display: flex; align-items: center; justify-content: center; flex: none"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1F2A5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16V7a1 1 0 0 1 1-1h11l4 4h2a2 2 0 0 1 2 2v4 M9 17h6 M5 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M15 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; text-align: right; line-height: 1.4"><span style="font-size: 28px; font-weight: 800">{{label}}</span><span style="font-size: 16px; font-weight: 700">{{sub}}</span></span>
    </button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: false }; }
  renderVals() {
    const on = this.state.on;
    return {
      bg: on ? '#17705A' : '#1F2A5C',
      label: on ? 'سفر جاری ہے' : 'صبح کا چکر شروع',
      sub: on ? 'جگہ لائیو شیئر ہو رہی ہے · ختم کرنے کے لیے دبائیں' : 'دبا کر رکھیں · سب والدین کو خبر',
      go: () => this.setState({ on: !on })
    };
  }
}
</script>
</body>
</html>
