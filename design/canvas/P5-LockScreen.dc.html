<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Lock-screen notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #1B2430; color: #FFFFFF; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column; padding: 40px 12px 24px; gap: 10px">
  <div dir="ltr" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; line-height: 1.1">
    <span style="font-size: 72px; font-weight: 600; letter-spacing: -2px">2:01</span>
    <span style="font-size: 16px; font-weight: 600; margin-top: 8px">Tuesday 27 October</span>
  </div>

  <sc-for list="{{notes}}" as="n" hint-placeholder-count="5">
    <article style="background: #F4F4F2; color: #121212; border-radius: 20px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: {{n.bg}}; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 4px">
        <sc-if value="{{n.isLeft}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16V7a1 1 0 0 1 1-1h11l4 4h2a2 2 0 0 1 2 2v4"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle><path d="M9 17h6"></path></svg></sc-if>
        <sc-if value="{{n.isPicked}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-1a6 6 0 0 1 6-6h3"></path><path d="m14.5 18 2.5 2.5 5-5"></path></svg></sc-if>
        <sc-if value="{{n.isSchool}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFC21A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V10l7-4 7 4v11"></path><path d="M10 21v-5h4v5"></path><path d="M12 6V2l4 1.5L12 5"></path></svg></sc-if>
        <sc-if value="{{n.isLeftSchool}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5"></path><path d="m15 7 5 5-5 5"></path><path d="M20 12H9"></path></svg></sc-if>
        <sc-if value="{{n.isDropped}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg></sc-if>
      </span>
      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
        <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #3A3A3A">
          <span>پہنچ · گلشن وین</span><span>{{n.time}}</span>
        </div>
        <span style="font-size: 18px; font-weight: 700; line-height: 1.8">{{n.ur}}</span>
        <span style="font-size: 15px; font-weight: 600">{{n.time}} · ڈرائیور نے مارک کیا</span>
        <span dir="ltr" lang="en" style="font-size: 14px; font-weight: 600; color: #2B2B2B; line-height: 1.4; text-align: left; margin-top: 4px">{{n.en}}</span>
      </div>
    </article>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { isLeft: false, isPicked: false, isSchool: false, isLeftSchool: false, isDropped: false };
    return {
      notes: [
        { ...base, isDropped: true, bg: '#00707A', time: '2:01', ur: 'علی کو گھر اتار دیا', en: 'Ali was dropped home at 2:01 — marked by the driver' },
        { ...base, isLeftSchool: true, bg: '#6B2FB3', time: '1:32', ur: 'وین اسکول سے نکل گئی', en: 'The van left school at 1:32 — marked by the driver' },
        { ...base, isSchool: true, bg: '#141414', time: '7:46', ur: 'وین اسکول پہنچ گئی', en: 'The van reached school at 7:46 — marked by the driver' },
        { ...base, isPicked: true, bg: '#0E7A3E', time: '7:12', ur: 'علی وین میں ہے', en: 'Ali is in the van, 7:12 — marked by the driver' },
        { ...base, isLeft: true, bg: '#1F4FD1', time: '7:05', ur: 'وین نکل گئی', en: 'The van has left, 7:05 — marked by the driver' }
      ]
    };
  }
}
</script>
</body>
</html>
