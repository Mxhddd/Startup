<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Pohnch Amaan women-only side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.5}
.f{height:40px;padding:0 14px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.card{display:flex;align-items:center;gap:10px;background:#FFFFFF;border-radius:18px;padding:10px 12px;box-shadow:inset 0 0 0 1px #E2DCCD}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.5; display: flex; flex-direction: column">
  <header style="position: relative; background: #0F5E4E; color: #FAF6EE; padding: 18px 18px 20px; overflow: hidden; flex: none">
    <svg width="390" height="190" aria-hidden="true" style="position: absolute; inset: 0"><defs><pattern id="zam" width="40" height="40" patternUnits="userSpaceOnUse"><path transform="translate(6 6) scale(0.44)" d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="#17705A"></path><circle cx="20" cy="20" r="2.2" fill="#C9A24A"></circle></pattern></defs><rect width="390" height="190" fill="url(#zam)"></rect></svg>
    <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: #FBEBCF"><svg width="40" height="20" viewBox="0 0 124 64" aria-hidden="true"><path d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="#C9A24A"></path><circle cx="32" cy="32" r="9" fill="#0F5E4E"></circle><circle cx="74" cy="32" r="5" fill="#C9A24A"></circle><circle cx="88" cy="32" r="3" fill="#C9A24A"></circle><circle cx="98" cy="32" r="3" fill="#C9A24A"></circle><circle cx="114" cy="32" r="6" fill="#FAF6EE"></circle></svg>پہنچ امان</span>
      <span class="disp" style="font-size: 34px">خواتین کی وینیں</span>
      <span style="font-size: 15px; font-weight: 700">خاتون ڈرائیور یا خاتون ساتھی، ہر سفر میں</span>
    </div>
  </header>
  <main style="flex: 1; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button class="f" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="background: {{f.bg}}; color: {{f.fg}}; box-shadow: inset 0 0 0 1.5px #0F5E4E">{{f.label}}</button></sc-for>
    </div>
    <sc-for list="{{vans}}" as="v" hint-placeholder-count="2">
      <div class="card">
        <span style="width: 50px; height: 50px; border-radius: 50%; background: #0F5E4E; color: #FAF6EE; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 4.5px #C9A24A; flex: none">{{v.i}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.35"><span style="font-size: 16px; font-weight: 800">{{v.name}}</span><span style="font-size: 14px; font-weight: 700; color: #4A4F66">{{v.meta}}</span></span>
        <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3"><span dir="ltr" style="font-size: 15px; font-weight: 800">{{v.fee}}</span><span style="font-size: 14px; font-weight: 800; color: #0F5E4E">{{v.seats}}</span></span>
      </div>
    </sc-for>
    <div style="background: #DCEFE7; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 800; color: #0B4A3D">امان کا وعدہ</span>
      <span style="font-size: 14px; font-weight: 700; color: #0B4A3D">پانچ تصدیقیں اور تربیت · صرف دن کے سفر · ہر سفر لائیو · آخری چکر کے بعد "میں گھر پہنچ گئی"</span>
    </div>
    <a href="XA-Apply.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #0F5E4E; color: #FAF6EE; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">خاتون ڈرائیور یا ساتھی بنیں</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 0 }; }
  renderVals() {
    const all = [
      { i: 'ش', name: 'شازیہ صاحبہ · جوہر', meta: 'خاتون ڈرائیور · 99% وقت پر · صرف بچیاں', fee: 'Rs 6,000', seats: '1 سیٹ', k: [0, 1] },
      { i: 'ن', name: 'نسرین صاحبہ · گلشن', meta: 'خاتون ساتھی · ڈرائیور اکرم بھائی', fee: 'Rs 5,800', seats: '3 سیٹیں', k: [0, 2] },
      { i: 'ف', name: 'فرزانہ صاحبہ · ڈیفنس', meta: 'خاتون ڈرائیور · اپنے بچوں کے ساتھ', fee: 'Rs 7,000', seats: '2 سیٹیں', k: [0, 1] }
    ];
    const labels = ['سب', 'خاتون ڈرائیور', 'خاتون ساتھی'];
    return {
      filters: labels.map((label, i) => { const on = i === this.state.f; return { label, on, bg: on ? '#0F5E4E' : '#FFFFFF', fg: on ? '#FAF6EE' : '#0F5E4E', pick: () => this.setState({ f: i }) }; }),
      vans: all.filter((v) => v.k.includes(this.state.f))
    };
  }
}
</script>
</body>
</html>
