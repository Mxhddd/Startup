<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sadak parent timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FFFFFF; color: #111111; font-family: Archivo, 'Noto Naskh Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column">
  <header data-component="TripHeader" data-role="parent" style="background: #111111; color: #FFFFFF; padding: 14px 16px; border-bottom: 6px solid #FFD400; display: flex; flex-direction: column">
    <span style="font-size: 22px; font-weight: 700; color: #FFD400">علی · صبح</span>
    <span style="font-size: 14px; font-weight: 500">گلشن وین · رفیق بھائی</span>
  </header>

  <section style="margin: 14px 12px 0; background: #FFD400; border: 4px solid #111111; padding: 16px; display: flex; flex-direction: column">
    <span style="font-size: 14px; font-weight: 700">ابھی</span>
    <span style="font-size: 30px; font-weight: 700">علی وین میں ہے</span>
    <span style="font-size: 16px; font-weight: 700">7:12 · ڈرائیور نے مارک کیا</span>
  </section>

  <ol style="list-style: none; margin: 14px 12px 0; padding: 0; display: flex; flex-direction: column; border: 3px solid #111111">
    <li data-component="TimelineEvent" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; border-bottom: 3px solid #111111">
      <span style="font-size: 16px; font-weight: 900; width: 50px">7:05</span><span style="font-size: 18px; font-weight: 700">وین نکل گئی</span>
    </li>
    <li data-component="TimelineEvent" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; border-bottom: 3px solid #111111; background: #111111; color: #FFD400">
      <span style="font-size: 16px; font-weight: 900; width: 50px">7:12</span><span style="font-size: 18px; font-weight: 700">علی وین میں ہے</span>
    </li>
    <li data-component="TimelineEvent" style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px">
      <span style="font-size: 16px; font-weight: 900; width: 50px">—</span><span style="font-size: 18px; font-weight: 500; color: #3A3A3A">اسکول پہنچنا</span>
    </li>
  </ol>

  <button style="margin: auto 12px 12px; height: 60px; border: 3px solid #111111; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 20px; font-weight: 700; cursor: pointer">آج چھٹی</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
