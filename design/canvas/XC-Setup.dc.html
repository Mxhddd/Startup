<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Captain setup v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.55}
.in{height:54px;border-radius:14px;border:0;box-shadow:inset 0 0 0 2px #141A33;background:#FFFFFF;padding:0 14px;font-family:inherit;font-size:18px;font-weight:700;color:#141A33;box-sizing:border-box}
.in:focus{outline:3px solid #E8A33D;outline-offset:2px}
label{font-size:16px;font-weight:800}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column; padding: 20px 16px 16px; gap: 10px">
  <div style="display: flex; align-items: center; gap: 8px">
    <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="#1F2A5C"></path><path d="M22 33 l7 7 l14 -14" fill="none" stroke="#E8A33D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span class="disp" style="font-size: 26px; color: #1F2A5C">پہنچ</span>
  </div>
  <span class="disp" style="font-size: 38px">اپنی وین بنائیں</span>
  <span style="font-size: 15px; font-weight: 700; color: #17705A; margin-top: -6px">آپ کیپٹن ہیں: آپ کے بچے کا پہنچ مفت</span>
  <div style="display: flex; flex-direction: column; gap: 2px"><label for="x-d">ڈرائیور کا پہلا نام</label><input id="x-d" class="in" value="رفیق"></div>
  <div style="display: flex; flex-direction: column; gap: 2px"><label for="x-s">اسکول کا نام</label><input id="x-s" class="in" value="نور اسکول"></div>
  <div style="display: flex; flex-direction: column; gap: 2px"><label for="x-t">صبح وین کب نکلتی ہے؟</label><input id="x-t" class="in" type="time" value="07:00" dir="ltr" style="font-family: Manrope, sans-serif; text-align: right"></div>
  <div style="background: #DCEFE7; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 15px; font-weight: 800; color: #0B4A3D">اختیاری · پہنچ امان</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{badges}}" as="b" hint-placeholder-count="3">
        <button aria-pressed="{{b.on}}" onClick="{{b.toggle}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: {{b.bg}}; color: {{b.fg}}; box-shadow: inset 0 0 0 1.5px #0F5E4E; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">{{b.label}}</button>
      </sc-for>
    </div>
  </div>
  <a href="XC-Share.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 62px; border-radius: 16px; background: #1F2A5C; color: #FAF6EE; text-decoration: none; font-size: 19px; font-weight: 800">لنک بنائیں</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: {} }; }
  renderVals() {
    const list = [{ id: 'driver', label: 'ڈرائیور صاحبہ' }, { id: 'companion', label: 'امان ساتھی' }, { id: 'girls', label: 'صرف بچیاں' }];
    return {
      badges: list.map((b) => {
        const on = !!this.state.on[b.id];
        return { ...b, on, bg: on ? '#0F5E4E' : '#FFFFFF', fg: on ? '#FAF6EE' : '#0F5E4E', toggle: () => this.setState({ on: { ...this.state.on, [b.id]: !on } }) };
      })
    };
  }
}
</script>
</body>
</html>
