<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>WhatsApp card how to join v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400}
</style>
</helmet>
<div dir="rtl" style="width: 1080px; height: 1080px; box-sizing: border-box; overflow: hidden; position: relative; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; padding: 80px 84px; display: flex; flex-direction: column; gap: 28px">
  <svg width="1080" height="120" aria-hidden="true" style="position: absolute; left: 0; bottom: 0"><defs><pattern id="wjb" width="60" height="60" patternUnits="userSpaceOnUse"><path transform="translate(8 8) scale(0.69)" d="{{S}}" fill="#1F2A5C"></path><circle cx="30" cy="30" r="3.5" fill="#E8A33D"></circle></pattern></defs><rect width="1080" height="120" fill="url(#wjb)"></rect></svg>
  <div style="display: flex; align-items: center; gap: 14px">
    <svg width="116" height="60" viewBox="0 0 124 64" aria-hidden="true"><path d="{{S}}" fill="#1F2A5C"></path><circle cx="32" cy="32" r="9" fill="#E8A33D"></circle><circle cx="74" cy="32" r="5" fill="#E8A33D"></circle><circle cx="88" cy="32" r="3" fill="#E8A33D"></circle><circle cx="98" cy="32" r="3" fill="#E8A33D"></circle><circle cx="114" cy="32" r="6" fill="#17705A"></circle></svg>
    <span class="disp" style="font-size: 52px; line-height: 1.4; color: #1F2A5C">پہنچ</span>
  </div>
  <span class="disp" style="font-size: 84px; line-height: 1.5">تین قدم، دو منٹ</span>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex: 1; margin-bottom: 120px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border-radius: 10px; box-shadow: inset 0 0 0 2px #C9A24A, inset 0 0 0 9px #FFFFFF, inset 0 0 0 10px #E2DCCD; padding: 34px 28px; display: flex; flex-direction: column; gap: 16px">
        <span style="width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; position: relative">
          <svg width="84" height="84" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; inset: 0"><path d="{{S}}" fill="{{s.c}}"></path></svg>
          <span style="position: relative; font-size: 36px; font-weight: 800; color: {{s.fg}}">{{s.n}}</span>
        </span>
        <span style="font-size: 40px; font-weight: 800; line-height: 1.45">{{s.t}}</span>
        <span style="font-size: 28px; font-weight: 600; line-height: 1.6">{{s.d}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      S: 'M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z',
      steps: [
        { n: 1, c: '#1F2A5C', fg: '#FAF6EE', t: 'لنک کھولیں', d: 'کیپٹن کا بھیجا ہوا لنک دبائیں۔ کوئی ایپ اسٹور نہیں۔' },
        { n: 2, c: '#E8A33D', fg: '#141A33', t: 'بچے کا نام چنیں', d: 'صرف پہلا نام۔ کیپٹن آپ کا نمبر پہچان کر ہاں کریں گے۔' },
        { n: 3, c: '#17705A', fg: '#FFFFFF', t: 'اطلاعات آن کریں', d: 'بس۔ اب ہر ٹیپ کی خبر آپ کے فون پر۔ پہلا مہینہ مفت۔' }
      ]
    };
  }
}
</script>
</body>
</html>
