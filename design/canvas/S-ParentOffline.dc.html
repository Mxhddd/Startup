<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Parent offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF8F3; color: #121212; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" data-role="parent" style="background: #FFFFFF; border-bottom: 2px solid #121212; padding: 12px 16px; display: flex; flex-direction: column">
    <span style="font-size: 20px; font-weight: 700">علی · صبح کا چکر</span>
    <span style="font-size: 14px; color: #3A3A3A; font-weight: 600">گلشن وین · ڈرائیور رفیق بھائی</span>
  </header>

  <div data-component="OfflineBanner" data-role="parent" role="status" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #FFF3D6; border-bottom: 3px solid #8A5A00; color: #3D2800">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6B4600" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20"></path><path d="M8.5 16.5a5 5 0 0 1 7 0"></path><path d="M5 12.5a10 10 0 0 1 5.2-2.8"></path><path d="M19 12.5a10 10 0 0 0-2.5-1.8"></path><path d="M12 20h.01"></path></svg>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.7">
      <span style="font-size: 17px; font-weight: 700">آپ کا انٹرنیٹ بند ہے</span>
      <span style="font-size: 15px; font-weight: 600">یہ 7:14 تک کی خبر ہے۔ انٹرنیٹ آتے ہی تازہ ہو جائے گی۔</span>
    </span>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px">
    <section style="background: #0E7A3E; color: #FFFFFF; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
      <span style="display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; height: 52px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0E7A3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-1a6 6 0 0 1 6-6h3"></path><path d="m14.5 18 2.5 2.5 5-5"></path></svg>
        </span>
        <span style="font-size: 26px; font-weight: 700; line-height: 1.7">علی وین میں ہے</span>
      </span>
      <span style="font-size: 16px; font-weight: 600">7:12 بجے · ڈرائیور نے مارک کیا</span>
    </section>
    <span style="font-size: 16px; font-weight: 600">اطلاعات انٹرنیٹ آنے پر خود پہنچ جائیں گی۔ آپ کو کچھ نہیں کرنا۔</span>
    <button disabled style="margin-top: auto; height: 56px; border: 2px dashed #8A857A; border-radius: 14px; background: #EEEBE4; color: #3A3A3A; font-family: inherit; font-size: 17px; font-weight: 700">چھٹی کے لیے انٹرنیٹ چاہیے</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
