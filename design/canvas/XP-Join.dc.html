<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Parent join v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.55}
.on{height:52px;border-radius:12px;border:0;background:#1F2A5C;color:#FAF6EE;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer}
.off{height:52px;border-radius:12px;border:0;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #E2DCCD;color:#141A33;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column">
  <div style="position: relative; height: 150px; background: #1F2A5C; flex: none">
    <svg width="360" height="150" aria-hidden="true" style="position: absolute; inset: 0"><defs><pattern id="xpj" width="40" height="40" patternUnits="userSpaceOnUse"><path transform="translate(6 6) scale(0.44)" d="{{S}}" fill="#2B3A80"></path><circle cx="20" cy="20" r="2.4" fill="#E8A33D"></circle><circle cx="0" cy="0" r="2" fill="#A8321F"></circle><circle cx="40" cy="0" r="2" fill="#A8321F"></circle><circle cx="0" cy="40" r="2" fill="#A8321F"></circle><circle cx="40" cy="40" r="2" fill="#A8321F"></circle></pattern></defs><rect width="360" height="150" fill="url(#xpj)"></rect></svg>
    <div style="position: absolute; right: 16px; left: 16px; bottom: -44px; background: #FFFFFF; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #C9A24A, inset 0 0 0 5px #FFFFFF, inset 0 0 0 6px #E2DCCD, 0 10px 24px -14px rgba(20,26,51,.45); padding: 14px 18px; display: flex; align-items: center; gap: 12px">
      <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><path d="{{S}}" fill="#1F2A5C"></path><path d="M22 33 l7 7 l14 -14" fill="none" stroke="#E8A33D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.4"><span style="font-size: 20px; font-weight: 800">گلشن وین</span><span style="font-size: 14px; font-weight: 600; color: #4A4F66">رفیق بھائی · نور اسکول · بھروسہ 96%</span></span>
    </div>
  </div>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 60px 16px 16px">
    <span class="disp" style="font-size: 30px">آپ کا بچہ کون سا ہے؟</span>
    <div role="radiogroup" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{kids}}" as="k" hint-placeholder-count="6">
        <sc-if value="{{k.on}}" hint-placeholder-val="{{ false }}"><button role="radio" aria-checked="true" class="on" onClick="{{k.pick}}">{{k.name}}</button></sc-if>
        <sc-if value="{{k.off}}" hint-placeholder-val="{{ true }}"><button role="radio" aria-checked="false" class="off" onClick="{{k.pick}}">{{k.name}}</button></sc-if>
      </sc-for>
    </div>
    <span class="disp" style="font-size: 30px">آپ کون ہیں؟</span>
    <div role="radiogroup" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{who}}" as="w" hint-placeholder-count="5">
        <sc-if value="{{w.on}}" hint-placeholder-val="{{ false }}"><button role="radio" aria-checked="true" class="on" style="height: 46px; padding: 0 16px; border-radius: 999px; background: #E8A33D; color: #141A33" onClick="{{w.pick}}">{{w.label}}</button></sc-if>
        <sc-if value="{{w.off}}" hint-placeholder-val="{{ true }}"><button role="radio" aria-checked="false" class="off" style="height: 46px; padding: 0 16px; border-radius: 999px" onClick="{{w.pick}}">{{w.label}}</button></sc-if>
      </sc-for>
    </div>
    <span style="font-size: 15px; font-weight: 600; color: #4A4F66">کیپٹن سارہ منظوری دیں گی۔ پہلا مہینہ مفت، پھر Rs 199 ماہانہ۔</span>
    <a href="XP-Pending.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 62px; border-radius: 16px; background: #1F2A5C; color: #FAF6EE; text-decoration: none; font-size: 18px; font-weight: 800">{{cta}}</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kid: 'علی', who: 'امی' }; }
  renderVals() {
    const names = ['علی', 'فاطمہ', 'حمزہ', 'عائشہ', 'زین', 'مریم'];
    const whos = ['امی', 'ابو', 'دادی / نانی', 'دادا / نانا', 'کوئی اور'];
    return {
      S: 'M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z',
      kids: names.map((n) => ({ name: n, on: n === this.state.kid, off: n !== this.state.kid, pick: () => this.setState({ kid: n }) })),
      who: whos.map((w) => ({ label: w, on: w === this.state.who, off: w !== this.state.who, pick: () => this.setState({ who: w }) })),
      cta: this.state.kid + ' · ' + this.state.who + ' · منظوری کے لیے بھیجیں'
    };
  }
}
</script>
</body>
</html>
