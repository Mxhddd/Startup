<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver practice v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
button{touch-action:none;user-select:none;-webkit-user-select:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border-radius:16px;border:0;font-family:inherit;font-size:19px;font-weight:800;text-decoration:none;cursor:pointer;box-sizing:border-box}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column; position: relative">
  <div style="background: #E8A33D; padding: 14px 18px; display: flex; align-items: center; gap: 10px">
    <span style="flex: 1; font-size: 18px; font-weight: 800">مشق · کسی کو خبر نہیں جائے گی</span>
    <a href="XD-Before.dc.html" style="font-size: 15px; font-weight: 800; color: #141A33">چھوڑیں</a>
  </div>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 22px 16px 16px">
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <span style="flex: 1; height: 8px; border-radius: 4px; background: {{bar1}}"></span>
      <span style="flex: 1; height: 8px; border-radius: 4px; background: {{bar2}}"></span>
      <span style="flex: 1; height: 8px; border-radius: 4px; background: {{bar3}}"></span>
    </div>
    <span role="status" style="font-size: 26px; font-weight: 800; line-height: 1.5">{{instruction}}</span>
    <span style="font-size: 17px; font-weight: 600">{{hint}}</span>

    <sc-if value="{{isHold}}" hint-placeholder-val="{{ true }}">
      <button aria-label="نکل گئے: دبا کر رکھیں" onPointerDown="{{startHold}}" onPointerUp="{{stopHold}}" onPointerLeave="{{stopHold}}" style="position: relative; overflow: hidden; margin-top: 18px; height: 124px; border: 0; border-radius: 20px; background: #1F2A5C; color: #FAF6EE; font-family: inherit; cursor: pointer">
        <span style="position: absolute; top: 0; bottom: 0; right: 0; width: {{progress}}%; background: #2B3A80; border-left: 4px solid #E8A33D"></span>
        <span style="position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.5"><span style="font-size: 30px; font-weight: 800">نکل گئے</span><span style="font-size: 16px; font-weight: 700">دبا کر رکھیں</span></span>
      </button>
    </sc-if>
    <sc-if value="{{isTap}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{tapChild}}" style="margin-top: 18px; height: 108px; border: 0; border-radius: 20px; background: #17705A; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; gap: 14px; padding: 0 18px; text-align: right; cursor: pointer">
        <span style="width: 62px; height: 62px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#17705A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M2 21v-1a6 6 0 0 1 6-6h3 M14.5 18l2.5 2.5 5-5"></path></svg></span>
        <span style="display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 26px; font-weight: 800">علی</span><span style="font-size: 17px; font-weight: 700">بٹھا لیا</span></span>
      </button>
    </sc-if>
    <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <svg width="110" height="110" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="#17705A"></path><path d="M22 33 l7 7 l14 -14" fill="none" stroke="#FAF6EE" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <a href="XD-Before.dc.html" class="btn" style="width: 100%; background: #1F2A5C; color: #FAF6EE">آج کی فہرست کھولیں</a>
        <button onClick="{{restart}}" style="height: 48px; border: 0; background: transparent; font-family: inherit; font-size: 16px; font-weight: 800; text-decoration: underline; color: #141A33; cursor: pointer">دوبارہ مشق</button>
      </div>
    </sc-if>
  </main>
  <sc-if value="{{isUndo}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 16px; background: #141A33; color: #FAF6EE; border-radius: 20px; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 52px; border-radius: 50%; border: 4px solid #E8A33D; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #E8A33D; box-sizing: border-box; flex: none">{{count}}</span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 17px; font-weight: 800">علی · بٹھا لیا</span><span style="font-size: 14px; font-weight: 600">{{count}} سیکنڈ میں والدین کو خبر</span></span>
      <button onClick="{{undo}}" style="height: 64px; padding: 0 22px; border: 0; border-radius: 14px; background: #E8A33D; color: #141A33; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer">واپس</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'hold', progress: 0, count: 5, undone: false };
  }
  componentWillUnmount() { clearInterval(this.holdTimer); clearInterval(this.countTimer); }
  renderVals() {
    const s = this.state;
    const startHold = () => {
      clearInterval(this.holdTimer);
      this.holdTimer = setInterval(() => {
        const p = Math.min(100, this.state.progress + 10);
        this.setState({ progress: p });
        if (p >= 100) { clearInterval(this.holdTimer); this.setState({ phase: 'tap', progress: 0 }); }
      }, 100);
    };
    const stopHold = () => { clearInterval(this.holdTimer); if (this.state.phase === 'hold') this.setState({ progress: 0 }); };
    const tapChild = () => {
      this.setState({ phase: 'undo', count: 5 });
      clearInterval(this.countTimer);
      this.countTimer = setInterval(() => {
        const c = this.state.count - 1;
        if (c <= 0) { clearInterval(this.countTimer); this.setState({ phase: 'done', count: 0 }); } else this.setState({ count: c });
      }, 1000);
    };
    const undo = () => { clearInterval(this.countTimer); this.setState({ phase: 'tap', undone: true }); };
    const restart = () => this.setState({ phase: 'hold', progress: 0, count: 5, undone: false });
    const text = {
      hold: ['1 · بڑا بٹن دبا کر رکھیں', 'نیلا بٹن ایک سیکنڈ دبائے رکھیں جب تک بھر نہ جائے۔'],
      tap: [s.undone ? 'واپس ہو گیا! اب پھر ٹیپ کریں' : '2 · ہر بچے کے لیے ایک ٹیپ', s.undone ? 'اس بار 5 سیکنڈ رکیں، خبر خود چلی جائے گی۔' : 'بچہ بیٹھ جائے تو اس کے نام پر ایک بار۔'],
      undo: ['3 · غلطی ہو تو واپس', 'نیچے گنتی چل رہی ہے۔ غلط دبا ہو تو "واپس" دبائیں۔'],
      done: ['شاباش! آپ تیار ہیں', 'اسی طرح ہر روز، بس وین رکی ہو تو۔']
    }[s.phase];
    const step = { hold: 1, tap: 2, undo: 3, done: 4 }[s.phase];
    const on = '#1F2A5C', off = '#E2DCCD';
    return {
      instruction: text[0], hint: text[1],
      isHold: s.phase === 'hold', isTap: s.phase === 'tap', isUndo: s.phase === 'undo', isDone: s.phase === 'done',
      progress: s.progress, count: s.count,
      bar1: step >= 1 ? on : off, bar2: step >= 2 ? on : off, bar3: step >= 3 ? on : off,
      startHold, stopHold, tapChild, undo, restart
    };
  }
}
</script>
</body>
</html>
