<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Parent find a van</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.55}
.chip{height:40px;padding:0 14px;border-radius:999px;border:0;font-family:inherit;font-size:15px;font-weight:800;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column; padding: 20px 16px 16px; gap: 12px">
  <span class="disp" style="font-size: 36px">وین ڈھونڈیں</span>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <span class="chip" style="background: #1F2A5C; color: #FAF6EE">گلشن اقبال</span>
    <span class="chip" style="background: #1F2A5C; color: #FAF6EE">نور اسکول</span>
    <button class="chip" onClick="{{toggle}}" aria-pressed="{{amaan}}" style="background: {{aBg}}; color: {{aFg}}; box-shadow: inset 0 0 0 1.5px #0F5E4E"><svg width="14" height="14" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="{{aFg}}"></path></svg>صرف امان</button>
  </div>
  <span style="font-size: 14px; font-weight: 700; color: #4A4F66">{{count}} وینیں · بھروسہ = پچھلے 30 دن کے وقت پر ٹیپ</span>
  <sc-for list="{{vans}}" as="v" hint-placeholder-count="3">
    <a href="{{v.href}}" style="background: #FFFFFF; border-radius: 16px; box-shadow: inset 0 0 0 1px #E2DCCD; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; color: #141A33; text-decoration: none">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 44px; height: 44px; border-radius: 50%; background: {{v.c}}; color: #FAF6EE; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800">{{v.i}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.35"><span style="font-size: 17px; font-weight: 800">{{v.name}}</span><span style="font-size: 14px; font-weight: 600; color: #4A4F66">{{v.van}}</span></span>
        <span style="display: flex; flex-direction: column; align-items: center; line-height: 1.2"><span style="font-size: 20px; font-weight: 800; color: #17705A">{{v.rel}}</span><span style="font-size: 14px; font-weight: 700">بھروسہ</span></span>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; font-size: 14px; font-weight: 800">
        <span style="background: #FBEBCF; border-radius: 8px; padding: 0 8px">{{v.seats}} سیٹیں خالی</span>
        <span style="background: #EEE9DF; border-radius: 8px; padding: 0 8px">{{v.fee}}</span>
        <sc-if value="{{v.isAmaan}}" hint-placeholder-val="{{ false }}"><span style="background: #DCEFE7; color: #0F5E4E; border-radius: 8px; padding: 0 8px">امان · ڈرائیور صاحبہ</span></sc-if>
      </div>
    </a>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amaan: false }; }
  renderVals() {
    const all = [
      { name: 'رفیق بھائی', i: 'ر', van: 'گلشن وین · 3 مہینے', rel: '96%', seats: 2, fee: 'وین فیس Rs 4,000–4,500', c: '#1F2A5C', isAmaan: false, href: 'XP-Driver.dc.html' },
      { name: 'شازیہ صاحبہ', i: 'ش', van: 'جوہر امان وین · 5 مہینے', rel: '99%', seats: 1, fee: 'وین فیس Rs 5,000', c: '#0F5E4E', isAmaan: true, href: 'XA-Listing.dc.html' },
      { name: 'نسرین صاحبہ', i: 'ن', van: 'بلاک 10 امان وین · نئی', rel: 'نئی', seats: 4, fee: 'وین فیس Rs 4,500', c: '#0F5E4E', isAmaan: true, href: 'XA-Listing.dc.html' },
      { name: 'اسلم بھائی', i: 'ا', van: 'یونیورسٹی روڈ وین · 8 مہینے', rel: '91%', seats: 3, fee: 'وین فیس Rs 3,500', c: '#1F2A5C', isAmaan: false, href: 'XP-Driver.dc.html' }
    ];
    const vans = this.state.amaan ? all.filter((v) => v.isAmaan) : all.slice(0, 3);
    return {
      vans, count: this.state.amaan ? 2 : 7,
      amaan: this.state.amaan, aBg: this.state.amaan ? '#0F5E4E' : '#DCEFE7', aFg: this.state.amaan ? '#FAF6EE' : '#0F5E4E',
      toggle: () => this.setState({ amaan: !this.state.amaan })
    };
  }
}
</script>
</body>
</html>
