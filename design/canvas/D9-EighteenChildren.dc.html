<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver eighteen children</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 1040px; box-sizing: border-box; overflow: hidden; background: #FAF8F3; color: #121212; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #FFFFFF; border-bottom: 2px solid #121212; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 20px; font-weight: 700">صبح کا چکر</span>
        <span style="font-size: 14px; color: #3A3A3A; font-weight: 600">گلشن وین · منگل 27 اکتوبر</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 26px; font-weight: 800; line-height: 1.2">9/16</span>
        <span style="font-size: 14px; font-weight: 600">بیٹھ گئے</span>
      </div>
    </div>
    <div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #D6D2C8; overflow: hidden; display: flex">
      <span style="width: 56%; background: #0E7A3E"></span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px">
    <div style="display: flex; gap: 8px">
      <sc-for list="{{absent}}" as="kid" hint-placeholder-count="2">
        <span data-component="AbsentChip" style="flex: 1; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 12px; background: #EEEBE4; border: 2px dashed #8A857A; color: #4D4D4D; font-size: 16px; font-weight: 700">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D4D4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path><path d="m10 13 4 4M14 13l-4 4"></path></svg>
          {{kid.name}} · چھٹی
        </span>
      </sc-for>
    </div>

    <button data-component="ChildRow" data-state="done-group" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 14px; background: #FFFFFF; border: 2px solid #D6D2C8; border-radius: 12px; color: #121212; font-family: inherit; text-align: right; cursor: pointer">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #0E7A3E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      <span style="flex: 1; font-size: 17px; font-weight: 700">نکل گئے 7:05 · 9 بچے بیٹھ گئے</span>
      <span style="font-size: 15px; font-weight: 700; text-decoration: underline">دیکھیں</span>
    </button>

    <button data-component="TapButton" data-step="picked" data-size="next" style="display: flex; align-items: center; gap: 14px; height: 104px; padding: 0 16px; border: 0; border-radius: 18px; background: #0E7A3E; color: #FFFFFF; font-family: inherit; text-align: right; box-shadow: 0 4px 0 #075027; cursor: pointer">
      <span style="width: 60px; height: 60px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0E7A3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-1a6 6 0 0 1 6-6h3"></path><path d="m14.5 18 2.5 2.5 5-5"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.6">
        <span style="font-size: 26px; font-weight: 700">احمد</span>
        <span style="font-size: 18px; font-weight: 600">بٹھا لیا</span>
      </span>
      <span style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; box-sizing: border-box">11</span>
    </button>

    <sc-for list="{{waiting}}" as="kid" hint-placeholder-count="6">
      <button data-component="ChildRow" data-state="waiting" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 14px; background: #FFFFFF; border: 2px solid #0E7A3E; border-radius: 12px; color: #121212; font-family: inherit; text-align: right; cursor: pointer">
        <span style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #121212; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; box-sizing: border-box">{{kid.stop}}</span>
        <span style="flex: 1; font-size: 19px; font-weight: 700">{{kid.name}}</span>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: #0E7A3E">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E7A3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-1a6 6 0 0 1 6-6h3"></path><path d="m14.5 18 2.5 2.5 5-5"></path></svg>
          بٹھا لیا
        </span>
      </button>
    </sc-for>

    <button data-component="TapButton" data-step="reached_school" data-size="later" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border: 3px solid #141414; border-radius: 14px; background: #FFFFFF; color: #141414; font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V10l7-4 7 4v11"></path><path d="M10 21v-5h4v5"></path><path d="M12 6V2l4 1.5L12 5"></path></svg>
      اسکول پہنچ گئے
    </button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      absent: [{ name: 'مریم' }, { name: 'انعم' }],
      waiting: [
        { stop: 12, name: 'زینب' },
        { stop: 13, name: 'ابراہیم' },
        { stop: 15, name: 'یوسف' },
        { stop: 16, name: 'ماہم' },
        { stop: 17, name: 'ریان' },
        { stop: 18, name: 'علیزہ' }
      ]
    };
  }
}
</script>
</body>
</html>
