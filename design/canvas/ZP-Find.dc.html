<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Parent find a van on your route</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.field{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;border-radius:12px;background:#FAF6EE;font-size:15px;font-weight:700}
.tab{flex:1;height:42px;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.van{width:100%;border:0;border-radius:16px;font-family:inherit;text-align:right;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFE9DC; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.5">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-label="نقشہ: آپ کے گھر کے پاس سے گزرنے والی وینیں" style="position: absolute; inset: 0">
    <rect width="390" height="844" fill="#EFE9DC"></rect>
    <rect x="250" y="250" width="110" height="70" rx="16" fill="#DDEBCB"></rect>
    <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"><path d="M0 230 H390"></path><path d="M0 330 H390"></path><path d="M70 160 V520"></path><path d="M200 160 V520"></path><path d="M320 160 V520"></path><path d="M0 430 H390"></path></g>
    <g fill="none" stroke-linecap="round"><path d="M-10 290 C120 280 220 320 400 300" stroke="#DDD4C2" stroke-width="18"></path><path d="M-10 290 C120 280 220 320 400 300" stroke="#FFFFFF" stroke-width="12"></path><path d="M140 150 C150 260 120 380 170 520" stroke="#DDD4C2" stroke-width="18"></path><path d="M140 150 C150 260 120 380 170 520" stroke="#FFFFFF" stroke-width="12"></path></g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 200 C90 230 180 250 240 330 C270 370 300 420 380 440" stroke="{{r1}}" stroke-width="{{w1}}" opacity="{{o1}}"></path>
      <path d="M30 470 C120 430 200 380 250 350 C290 320 330 260 380 220" stroke="{{r2}}" stroke-width="{{w2}}" opacity="{{o2}}"></path>
      <path d="M100 160 C160 220 200 290 236 350 C250 390 240 450 220 520" stroke="{{r3}}" stroke-width="{{w3}}" opacity="{{o3}}"></path>
    </g>
    <circle cx="246" cy="342" r="52" fill="#17705A" fill-opacity=".10" stroke="#17705A" stroke-dasharray="4 6"></circle>
    <g transform="translate(246 342)"><circle r="12" fill="#17705A" stroke="#FFFFFF" stroke-width="4"></circle></g>
  </svg>

  <section style="position: absolute; top: 14px; right: 14px; left: 14px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 8px 24px rgba(20,26,51,.16); padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 18px; font-weight: 800; flex: 1">وین ڈھونڈیں · علی کے لیے</span><span style="font-size: 14px; font-weight: 800; color: #17705A">5 وینیں</span></div>
    <div class="field"><span style="width: 12px; height: 12px; border-radius: 50%; background: #17705A"></span>گھر · گلشن بلاک 13، گلی 4</div>
    <div class="field"><span style="width: 12px; height: 12px; border-radius: 3px; background: #E8A33D"></span>اسکول · نور اسکول، گلشن · صبح 7:45</div>
  </section>

  <section style="position: absolute; left: 0; right: 0; bottom: 0; height: 372px; background: #FFFFFF; border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px rgba(20,26,51,.16); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px">
    <span style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #E2DCCD"></span>
    <div style="display: flex; gap: 6px; background: #F3EEE3; border-radius: 14px; padding: 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button class="tab" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button></sc-for>
    </div>
    <sc-for list="{{vans}}" as="v" hint-placeholder-count="3">
      <button class="van" onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="background: {{v.bg}}; box-shadow: {{v.ring}}; color: #141A33">
        <span style="width: 8px; align-self: stretch; border-radius: 4px; background: {{v.c}}"></span>
        <span style="width: 44px; height: 44px; border-radius: 50%; background: {{v.av}}; color: #FAF6EE; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex: none">{{v.i}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.35; min-width: 0">
          <span style="font-size: 16px; font-weight: 800">{{v.name}}</span>
          <span style="font-size: 14px; font-weight: 700; color: #4A4F66">{{v.meta}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3"><span dir="ltr" style="font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800">{{v.fee}}</span><span style="font-size: 14px; font-weight: 700; color: {{v.sc}}">{{v.seats}}</span></span>
      </button>
    </sc-for>
    <a href="ZP-Van.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #1F2A5C; color: #FAF6EE; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">{{cta}}</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0, sel: 0 }; }
  renderVals() {
    const all = [
      { id: 0, name: 'رفیق بھائی · گلشن وین', i: 'ر', meta: 'گھر سے 120 میٹر · 96% وقت پر · 3 سال', fee: 'Rs 5,500', seats: '2 سیٹیں', c: '#1F2A5C', av: '#1F2A5C', amaan: false },
      { id: 1, name: 'شازیہ صاحبہ · جوہر امان وین', i: 'ش', meta: 'گھر سے 300 میٹر · 99% · خاتون ڈرائیور', fee: 'Rs 6,000', seats: '1 سیٹ', c: '#0F5E4E', av: '#0F5E4E', amaan: true },
      { id: 2, name: 'اسلم بھائی · یونیورسٹی روڈ', i: 'ا', meta: 'گھر سے 450 میٹر · 91% وقت پر', fee: 'Rs 4,800', seats: '4 سیٹیں', c: '#8A5A12', av: '#8A5A12', amaan: false },
      { id: 3, name: 'نسرین صاحبہ · امان ساتھی', i: 'ن', meta: 'گھر سے 600 میٹر · نئی · خاتون ساتھی', fee: 'Rs 5,800', seats: '3 سیٹیں', c: '#17705A', av: '#17705A', amaan: true }
    ];
    const s = this.state;
    const list = s.tab === 1 ? all.filter((v) => v.amaan) : all.slice(0, 3);
    const sel = list.find((v) => v.id === s.sel) || list[0];
    const line = (id, col) => ({ c: sel.id === id ? col : '#B9B2A2', w: sel.id === id ? 9 : 6, o: sel.id === id ? 1 : 0.8 });
    const l1 = line(0, '#1F2A5C'), l2 = line(s.tab === 1 ? 1 : 2, s.tab === 1 ? '#0F5E4E' : '#8A5A12'), l3 = line(s.tab === 1 ? 3 : 1, s.tab === 1 ? '#17705A' : '#0F5E4E');
    return {
      r1: l1.c, w1: l1.w, o1: l1.o, r2: l2.c, w2: l2.w, o2: l2.o, r3: l3.c, w3: l3.w, o3: l3.o,
      tabs: ['سب وینیں', 'پہنچ امان · خواتین'].map((label, i) => ({ label, on: i === s.tab, bg: i === s.tab ? (i === 1 ? '#0F5E4E' : '#141A33') : 'transparent', fg: i === s.tab ? '#FAF6EE' : '#141A33', pick: () => this.setState({ tab: i, sel: i === 1 ? 1 : 0 }) })),
      vans: list.map((v) => ({ ...v, on: v.id === sel.id, bg: v.id === sel.id ? '#FAF6EE' : '#FFFFFF', ring: v.id === sel.id ? 'inset 0 0 0 2px ' + v.c : 'inset 0 0 0 1px #E2DCCD', sc: '#17705A', pick: () => this.setState({ sel: v.id }) })),
      cta: sel.name.split(' · ')[0] + ' کی وین دیکھیں'
    };
  }
}
</script>
</body>
</html>
