<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Poster A3 Amaan recruitment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400}
.c{position:absolute;width:28px;height:28px}
</style>
</helmet>
<div dir="rtl" style="width: 1123px; height: 1587px; box-sizing: border-box; overflow: hidden; position: relative; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6">
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 700px; background: #0F5E4E; overflow: hidden; color: #FAF6EE">
    <svg width="1123" height="700" aria-hidden="true" style="position: absolute; inset: 0"><defs><pattern id="ap" width="96" height="96" patternUnits="userSpaceOnUse"><path transform="translate(15 15) scale(1.03)" d="{{S}}" fill="#17705A"></path><circle cx="48" cy="48" r="5" fill="#C9A24A"></circle></pattern></defs><rect width="1123" height="700" fill="url(#ap)"></rect></svg>
    <div style="position: absolute; top: 80px; right: 90px; display: flex; flex-direction: column; gap: 4px">
      <span style="display: inline-flex; align-items: center; gap: 14px; font-size: 36px; font-weight: 800; color: #FBEBCF"><svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><path d="{{S}}" fill="#C9A24A"></path><path d="M22 33 l7 7 l14 -14" fill="none" stroke="#0F5E4E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path></svg>پہنچ امان</span>
      <span class="disp" style="font-size: 116px; line-height: 1.45">اپنی وین،<br>اپنی کمائی</span>
    </div>
    <!-- flat illustration: a seal medallion with steering wheel -->
    <svg width="360" height="360" viewBox="0 0 360 360" aria-hidden="true" style="position: absolute; left: 90px; top: 170px">
      <path transform="translate(0 0) scale(5.625)" d="{{S}}" fill="#FAF6EE"></path>
      <path transform="translate(30 30) scale(4.69)" d="{{S}}" fill="none" stroke="#C9A24A" stroke-width="0.9"></path>
      <circle cx="180" cy="180" r="92" fill="none" stroke="#0F5E4E" stroke-width="20"></circle>
      <circle cx="180" cy="180" r="24" fill="#E8A33D"></circle>
      <path d="M180 156 V96 M160 192 L104 222 M200 192 L256 222" stroke="#0F5E4E" stroke-width="18" stroke-linecap="round"></path>
    </svg>
  </div>

  <div style="position: absolute; top: 750px; right: 90px; left: 90px; display: flex; flex-direction: column; gap: 22px">
    <span style="font-size: 44px; font-weight: 800">کراچی کی خواتین کے لیے، اسکول وین کا کام</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border-radius: 10px; box-shadow: inset 0 0 0 2px #C9A24A, inset 0 0 0 8px #FFFFFF, inset 0 0 0 9px #E2DCCD; padding: 26px 24px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 32px; font-weight: 800; color: #0F5E4E; line-height: 1.45">{{r.t}}</span>
          <span style="font-size: 24px; font-weight: 600; line-height: 1.6">{{r.d}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
      <span style="font-size: 26px; font-weight: 800">پہلے 5 تصدیقیں:</span>
      <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
        <span style="height: 52px; padding: 0 20px; border-radius: 999px; background: #DCEFE7; color: #0B4A3D; display: inline-flex; align-items: center; font-size: 24px; font-weight: 800">{{c}}</span>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; bottom: 80px; right: 90px; left: 90px; background: #141A33; color: #FAF6EE; border-radius: 10px; padding: 36px 44px; display: flex; align-items: center; gap: 32px">
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.45">
      <span style="font-size: 40px; font-weight: 800">درخواست: pohnch.pk/amaan</span>
      <span style="font-size: 28px; font-weight: 700">یا واٹس ایپ پر "امان" لکھیں: [نمبر] · ہماری ٹیم کی خاتون فون کریں گی</span>
    </span>
    <span style="width: 170px; height: 170px; border-radius: 14px; background: #FAF6EE; color: #141A33; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; flex: none">[QR]</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1123,"height":1587}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      S: 'M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z',
      roles: [
        { t: 'ڈرائیور صاحبہ', d: 'اپنی یا کرائے کی وین۔ وین فیس پوری آپ کی، اور وقت پر ٹیپ پر پہنچ کا انعام۔' },
        { t: 'امان ساتھی', d: 'وین میں بچوں کے ساتھ، صبح اور دوپہر۔ لائسنس ضروری نہیں۔' },
        { t: 'والدہ ڈرائیور', d: 'اپنے بچوں کے ساتھ 2 سے 4 اور بچے۔ اپنی کار بھی چلے گی۔' }
      ],
      checks: ['شناختی کارڈ', 'لائسنس', 'دو حوالے', 'تربیت', 'گھر کا دورہ']
    };
  }
}
</script>
</body>
</html>
