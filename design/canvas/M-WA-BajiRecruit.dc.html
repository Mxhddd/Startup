<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Baji recruitment card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2B544}a:hover{color:#FFFFFF}
</style>
</helmet>
<div dir="rtl" style="width: 1080px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #6E2C5A; color: #F6EFE2; font-family: Nunito, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; padding: 72px 80px; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; gap: 12px">
    <svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 L58 25 C59.5 26.2 58.7 28 56.8 28 H54 V33 C54 45 42 53 33.4 60.2 a2.2 2.2 0 0 1 -2.8 0 C22 53 10 45 10 33 V28 H7.2 C5.3 28 4.5 26.2 6 25 Z" fill="#F6EFE2"></path><path d="M22 35 l7 7 l14 -14" fill="none" stroke="#6E2C5A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-family: Gulzar, serif; font-size: 56px; line-height: 1.5">پہنچ</span>
    <span style="font-family: Gulzar, serif; font-size: 38px; line-height: 1.6; background: #F2B544; color: #6E2C5A; border-radius: 999px; padding: 0 20px">باجی</span>
  </div>

  <span style="font-family: Gulzar, serif; font-size: 100px; line-height: 1.55">اسکول کے وقت میں،<br>اپنی کمائی</span>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
    <div style="background: #F6EFE2; color: #1B2525; border-radius: 28px; padding: 18px 24px; display: flex; flex-direction: column; line-height: 1.7">
      <span style="font-size: 30px; font-weight: 700; color: #6E2C5A">وین چلائیں</span>
      <span style="font-size: 23px; font-weight: 600">ڈرائیونگ لائسنس ہو تو۔ اپنے بچے بھی ساتھ لے جائیں۔</span>
    </div>
    <div style="background: #F6EFE2; color: #1B2525; border-radius: 28px; padding: 18px 24px; display: flex; flex-direction: column; line-height: 1.7">
      <span style="font-size: 30px; font-weight: 700; color: #6E2C5A">اٹینڈنٹ بنیں</span>
      <span style="font-size: 23px; font-weight: 600">لائسنس نہیں؟ وین میں بچوں کو سنبھالیں۔</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; font-size: 27px; font-weight: 700">
    <span>صرف صبح اور دوپہر کے چکر · دن کی روشنی</span>
    <span>تصدیق، تربیت اور ایک بٹن پر مدد ہمارے ذمے</span>
    <span>[آمدنی] روپے ماہانہ تک</span>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 20px; background: #F2B544; color: #1B2525; border-radius: 32px; padding: 18px 30px">
    <span style="flex: 1; font-size: 32px; font-weight: 700; line-height: 1.7">نام اور علاقہ واٹس ایپ کریں</span>
    <span dir="ltr" style="font-size: 34px; font-weight: 900; line-height: 1.3">[number]</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
