<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver afternoon v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #1F2A5C; color: #FAF6EE; padding: 14px 16px; border-bottom: 5px solid #A8321F; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 21px; font-weight: 800">دوپہر کا چکر</span><span style="font-size: 14px; font-weight: 600">گلشن وین · ترتیب الٹی</span></div>
      <span style="font-size: 28px; font-weight: 800; line-height: 1">2/5</span>
      <a href="XD-Help.dc.html" style="height: 52px; padding: 0 14px; border-radius: 14px; background: #FAF6EE; color: #1F2A5C; text-decoration: none; display: flex; align-items: center; font-size: 16px; font-weight: 800">مدد</a>
    </div>
    <div data-component="RouteDots" aria-hidden="true" style="display: flex; align-items: center; gap: 4px">
      <svg width="28" height="28" viewBox="0 0 64 64" style="flex: none"><path d="{{S}}" fill="#A8321F" stroke="#FAF6EE" stroke-width="3"></path></svg>
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="flex: 1; border-top: 3px dotted #FAF6EE"></span><span style="width: 16px; height: 16px; border-radius: 50%; background: {{d.fill}}; border: 3px solid {{d.ring}}; box-sizing: border-box; flex: none"></span></sc-for>
    </div>
  </header>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px">
    <div data-component="TapButton" data-step="left_school" data-state="done" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: #F6DDD6; border-radius: 14px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8321F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5 M15 7l5 5-5 5 M20 12H9"></path></svg>
      <span style="flex: 1; font-size: 17px; font-weight: 800">اسکول سے نکلے</span><span style="font-size: 16px; font-weight: 800">1:32</span>
    </div>
    <sc-for list="{{done}}" as="k" hint-placeholder-count="2">
      <div data-component="ChildRow" data-state="done" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: #EEF6E4; border-radius: 14px">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: #A7D47E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#141A33" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
        <span style="flex: 1; font-size: 18px; font-weight: 700">{{k.name}}</span><span style="font-size: 16px; font-weight: 800">{{k.t}}</span>
      </div>
    </sc-for>
    <button data-component="TapButton" data-step="dropped" data-size="next" style="display: flex; align-items: center; gap: 14px; height: 108px; padding: 0 18px; border: 0; border-radius: 20px; background: #A7D47E; color: #141A33; font-family: inherit; text-align: right; box-shadow: 0 5px 0 #6E9A47; cursor: pointer">
      <span style="width: 62px; height: 62px; border-radius: 16px; background: #141A33; display: flex; align-items: center; justify-content: center; flex: none"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#A7D47E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7 M5 10v10h14V10 M10 20v-6h4v6"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 28px; font-weight: 800">حمزہ</span><span style="font-size: 17px; font-weight: 700">گھر اتار دیا · ایک ٹیپ</span></span>
      <span style="width: 38px; height: 38px; border-radius: 50%; box-shadow: inset 0 0 0 3px #141A33; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">3</span>
    </button>
    <sc-for list="{{waiting}}" as="k" hint-placeholder-count="2">
      <button data-component="ChildRow" data-state="waiting" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; background: #FFFFFF; border: 0; box-shadow: inset 0 0 0 2.5px #6E9A47; border-radius: 14px; color: #141A33; font-family: inherit; text-align: right; cursor: pointer">
        <span style="width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px #141A33; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">{{k.n}}</span>
        <span style="flex: 1; font-size: 19px; font-weight: 700">{{k.name}}</span><span style="font-size: 16px; font-weight: 800; color: #3E5E22">گھر اتار دیا</span>
      </button>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (d) => ({ fill: d ? '#A7D47E' : 'transparent', ring: d ? '#A7D47E' : '#FAF6EE' });
    return {
      S: 'M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z',
      dots: [dot(true), dot(true), dot(false), dot(false), dot(false)],
      done: [{ name: 'زین', t: '1:48' }, { name: 'عائشہ', t: '1:55' }],
      waiting: [{ n: 4, name: 'فاطمہ' }, { n: 5, name: 'علی' }]
    };
  }
}
</script>
</body>
</html>
