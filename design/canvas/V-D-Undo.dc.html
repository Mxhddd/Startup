<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver 5-second undo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5C5A}a:hover{color:#123C3B}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #F6EFE2; color: #1B2525; font-family: Nunito, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column; position: relative">
  <header data-component="TripHeader" style="background: #1E5C5A; color: #F6EFE2; border-radius: 0 0 28px 28px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.7"><span style="font-size: 21px; font-weight: 700">صبح کا چکر</span><span style="font-size: 14px; font-weight: 600">نکل گئے 7:05 · گلشن وین</span></div>
      <span style="font-size: 28px; font-weight: 900; line-height: 1">4/5</span>
    </div>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
        <span style="width: 16px; height: 16px; border-radius: 50%; background: {{d.fill}}; border: 3px solid {{d.ring}}; box-sizing: border-box; flex: none"></span>
        <span style="flex: 1; border-top: 3px dotted #F6EFE2"></span>
      </sc-for>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #F2B544; flex: none"></span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 120px">
    <sc-for list="{{done}}" as="k" hint-placeholder-count="3">
      <div data-component="ChildRow" data-state="done" style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; background: #FFFBF3; border-radius: 16px">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #0E7A3E"></span>
        <span style="flex: 1; font-size: 17px; font-weight: 700">{{k.name}}</span>
        <span style="font-size: 15px; font-weight: 800">{{k.t}}</span>
      </div>
    </sc-for>
    <div data-component="ChildRow" data-state="sending" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: #FFFBF3; border: 3px dashed #1B2525; border-radius: 16px">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #0E7A3E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
      <span style="flex: 1; font-size: 18px; font-weight: 700">عائشہ</span>
      <span style="font-size: 15px; font-weight: 800">بھیج رہے ہیں…</span>
    </div>

    <button data-component="TapButton" data-step="picked" data-size="next" style="display: flex; align-items: center; gap: 14px; height: 108px; padding: 0 18px; border: 0; border-radius: 26px; background: #0E7A3E; color: #FFFFFF; font-family: inherit; text-align: right; box-shadow: 0 5px 0 #075027; cursor: pointer">
      <span style="width: 62px; height: 62px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0E7A3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M2 21v-1a6 6 0 0 1 6-6h3 M14.5 18l2.5 2.5 5-5"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 28px; font-weight: 700">زین</span><span style="font-size: 17px; font-weight: 700">بٹھا لیا · ایک ٹیپ</span></span>
      <span style="width: 38px; height: 38px; border-radius: 50%; border: 3px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; box-sizing: border-box">5</span>
    </button>
  </main>

  <div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 16px; background: #1B2525; color: #F6EFE2; border-radius: 26px; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 56px; height: 56px; flex: none">
      <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="24" fill="none" stroke="#3A4747" stroke-width="5"></circle><circle cx="28" cy="28" r="24" fill="none" stroke="#F2B544" stroke-width="5" stroke-dasharray="90 151" transform="rotate(-90 28 28)" stroke-linecap="round"></circle><text x="28" y="36" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="22" fill="#F2B544">3</text></svg>
    </span>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 17px; font-weight: 700">عائشہ · بٹھا لیا</span><span style="font-size: 14px; font-weight: 600">3 سیکنڈ میں والدین کو خبر</span></span>
    <a href="V-D-MidRoute.dc.html" style="height: 64px; padding: 0 22px; border-radius: 18px; background: #F2B544; color: #1B2525; text-decoration: none; display: flex; align-items: center; font-size: 20px; font-weight: 800">واپس</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (done) => ({ fill: done ? '#F2B544' : 'transparent', ring: done ? '#F2B544' : '#F6EFE2' });
    return {
      dots: [dot(true), dot(true), dot(true), dot(true), dot(false)],
      done: [{ name: 'علی', t: '7:12' }, { name: 'فاطمہ', t: '7:18' }, { name: 'حمزہ', t: '7:24' }]
    };
  }
}
</script>
</body>
</html>
