<x-dc>
<helmet>

<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF8F3; color: #121212; font-family: Inter, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column; padding: 22px 18px 18px; gap: 16px">
  <div style="display: flex; align-items: center; gap: 8px">
    <span style="width: 32px; height: 32px; border-radius: 9px; background: #121212; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><path d="m9 9.6 2.2 2.2L15.5 7.6"></path></svg>
    </span>
    <span style="font-size: 20px; font-weight: 700">پہنچ</span>
  </div>

  <div style="display: flex; flex-direction: column">
    <span style="font-size: 28px; font-weight: 700; line-height: 1.8">اپنی وین بنائیں</span>
    <span style="font-size: 16px; font-weight: 600">صرف تین چیزیں۔ پھر آپ کو دو لنک ملیں گے: ایک ڈرائیور کے لیے، ایک والدین کے لیے۔</span>
  </div>

  <form style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="driver" style="font-size: 17px; font-weight: 700">ڈرائیور کا پہلا نام</label>
      <input id="driver" value="رفیق" style="height: 56px; border-radius: 12px; border: 2px solid #121212; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 19px; font-weight: 600; color: #121212; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="school" style="font-size: 17px; font-weight: 700">اسکول کا نام</label>
      <input id="school" value="نور اسکول" style="height: 56px; border-radius: 12px; border: 2px solid #121212; background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 19px; font-weight: 600; color: #121212; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="time" style="font-size: 17px; font-weight: 700">صبح وین کب نکلتی ہے؟</label>
      <input id="time" type="time" value="07:00" dir="ltr" style="height: 56px; border-radius: 12px; border: 2px solid #121212; background: #FFFFFF; padding: 0 14px; font-family: Inter, sans-serif; font-size: 19px; font-weight: 700; color: #121212; box-sizing: border-box; text-align: right">
    </div>
  </form>

  <span style="font-size: 14px; font-weight: 600; color: #3A3A3A">بچوں کے نام والدین خود لنک سے ڈالیں گے</span>

  <a href="C2-Share.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 16px; background: #121212; color: #FFFFFF; text-decoration: none; font-size: 20px; font-weight: 700">
    لنک بنائیں
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m11 6-6 6 6 6"></path></svg>
  </a>
</div>
</x-dc>
