<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver holding left button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5C5A}a:hover{color:#123C3B}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #F6EFE2; color: #1B2525; font-family: Nunito, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #1E5C5A; color: #F6EFE2; border-radius: 0 0 28px 28px; padding: 14px 16px 16px; display: flex; align-items: center; gap: 10px">
    <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.7"><span style="font-size: 21px; font-weight: 700">صبح کا چکر</span><span style="font-size: 14px; font-weight: 600">گلشن وین · منگل 27 اکتوبر</span></div>
    <span style="font-size: 28px; font-weight: 900; line-height: 1">0/5</span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 14px 14px">
    <span style="font-family: Gulzar, serif; font-size: 30px; line-height: 1.6; text-align: center">دبائے رکھیں…</span>
    <a href="V-D-MidRoute.dc.html" data-component="TapButton" data-step="left" data-state="holding" style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; height: 140px; padding: 0 18px; border-radius: 26px; background: #2747B8; color: #FFFFFF; text-decoration: none; outline: 6px solid #B9C6F2">
      <span style="position: absolute; top: 0; bottom: 0; right: 0; width: 62%; background: #1A3486"></span>
      <span style="position: relative; width: 66px; height: 66px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="66" height="66" viewBox="0 0 66 66" aria-hidden="true"><circle cx="33" cy="33" r="28" fill="none" stroke="#DCE3F9" stroke-width="6"></circle><circle cx="33" cy="33" r="28" fill="none" stroke="#2747B8" stroke-width="6" stroke-dasharray="109 176" transform="rotate(-90 33 33)" stroke-linecap="round"></circle></svg>
      </span>
      <span style="position: relative; flex: 1; display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 30px; font-weight: 700">نکل گئے</span><span style="font-size: 16px; font-weight: 700">ہاتھ نہ ہٹائیں</span></span>
    </a>
    <div style="background: #FFFBF3; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 17px; font-weight: 700">ایک سیکنڈ کیوں؟</span>
      <span style="font-size: 16px; font-weight: 600">یہ بٹن سب والدین کو خبر دیتا ہے، اس لیے جیب میں یا غلطی سے نہیں دبتا۔ ہاتھ ہٹا لیں تو کچھ نہیں جائے گا۔</span>
    </div>
    <div style="margin-top: auto; display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #1E5C5A"></span>
      فون ہلکا سا لرزے گا جب پورا ہو جائے
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
