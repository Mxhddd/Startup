<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver card front</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5C5A}a:hover{color:#123C3B}
</style>
</helmet>
<div dir="rtl" style="width: 559px; height: 397px; box-sizing: border-box; overflow: hidden; background: #F6EFE2; color: #1B2525; font-family: Nunito, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.8; padding: 26px 30px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: Gulzar, serif; font-size: 38px; line-height: 1.5">صرف رکی وین میں ٹیپ</span>
    <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 L58 25 C59.5 26.2 58.7 28 56.8 28 H54 V33 C54 45 42 53 33.4 60.2 a2.2 2.2 0 0 1 -2.8 0 C22 53 10 45 10 33 V28 H7.2 C5.3 28 4.5 26.2 6 25 Z" fill="#1E5C5A"></path><path d="M22 35 l7 7 l14 -14" fill="none" stroke="#F2B544" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </div>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="width: 78px; height: 78px; border-radius: 20px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{s.icon}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>
        </span>
        <span style="font-size: 15px; font-weight: 700; text-align: center; line-height: 1.6">{{s.ur}}</span>
        <span style="font-size: 12px; font-weight: 800; color: #4A4339">{{s.how}}</span>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; background: #1E5C5A; color: #F6EFE2; border-radius: 16px; padding: 6px 16px">
    <span style="font-size: 26px; font-weight: 900">5</span>
    <span style="font-size: 15px; font-weight: 700">غلط دب گیا؟ 5 سیکنڈ میں "واپس" دبائیں، کسی کو خبر نہیں جائے گی</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":559,"height":397}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { ur: 'نکل گئے', how: 'دبا کر رکھیں', bg: '#2747B8', icon: '#FFFFFF', d: 'M2 16V7a1 1 0 0 1 1-1h11l4 4h2a2 2 0 0 1 2 2v4 M9 17h6 M5 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M15 17a2 2 0 1 0 4 0a2 2 0 1 0-4 0' },
        { ur: 'بٹھا لیا', how: 'ہر بچہ، ایک ٹیپ', bg: '#0E7A3E', icon: '#FFFFFF', d: 'M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M2 21v-1a6 6 0 0 1 6-6h3 M14.5 18l2.5 2.5 5-5' },
        { ur: 'اسکول پہنچ گئے', how: 'دبا کر رکھیں', bg: '#1B2525', icon: '#F2B544', d: 'M3 21h18 M5 21V10l7-4 7 4v11 M10 21v-5h4v5 M12 6V2l4 1.5L12 5' },
        { ur: 'اسکول سے نکلے', how: 'دبا کر رکھیں', bg: '#F2B544', icon: '#1B2525', d: 'M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5 M15 7l5 5-5 5 M20 12H9' },
        { ur: 'گھر اتار دیا', how: 'ہر بچہ، ایک ٹیپ', bg: '#1E5C5A', icon: '#FFFFFF', d: 'M3 11 12 4l9 7 M5 10v10h14V10 M10 20v-6h4v6' }
      ]
    };
  }
}
</script>
</body>
</html>
