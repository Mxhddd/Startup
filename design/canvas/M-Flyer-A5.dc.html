<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Pohnch parent flyer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5C5A}a:hover{color:#123C3B}
</style>
</helmet>
<div dir="rtl" style="width: 559px; height: 794px; box-sizing: border-box; overflow: hidden; background: #F6EFE2; color: #1B2525; font-family: Nunito, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; padding: 44px 44px 40px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 L58 25 C59.5 26.2 58.7 28 56.8 28 H54 V33 C54 45 42 53 33.4 60.2 a2.2 2.2 0 0 1 -2.8 0 C22 53 10 45 10 33 V28 H7.2 C5.3 28 4.5 26.2 6 25 Z" fill="#1E5C5A"></path><path d="M22 35 l7 7 l14 -14" fill="none" stroke="#F2B544" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="font-family: Gulzar, serif; font-size: 44px; line-height: 1.5; color: #1E5C5A">پہنچ</span>
  </div>
  <span style="font-family: Gulzar, serif; font-size: 80px; line-height: 1.5">فکر کم، خبر پوری</span>
  <span style="font-size: 19px; font-weight: 700">ڈرائیور رکی وین میں بٹن دباتے ہیں، آپ کو فوراً اطلاع:</span>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; background: #FFFBF3; border-radius: 16px; padding: 4px 14px">
        <span style="width: 18px; height: 18px; border-radius: 50%; background: {{a.c}}; flex: none"></span>
        <span style="flex: 1; font-size: 19px; font-weight: 700">{{a.ur}}</span>
        <span style="font-size: 16px; font-weight: 800; color: #4A4339">{{a.t}}</span>
      </div>
    </sc-for>
  </div>

  <span style="font-size: 17px; font-weight: 600">بچے کی چھٹی؟ ایک ٹیپ میں ڈرائیور کو بتائیں۔ کوئی پاس ورڈ نہیں، کوئی ایپ اسٹور نہیں۔</span>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 16px; background: #1E5C5A; color: #F6EFE2; border-radius: 22px; padding: 14px 18px">
    <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.7">
      <span style="font-size: 20px; font-weight: 700">اپنی وین کے کیپٹن سے لنک مانگیں</span>
      <span style="font-size: 17px; font-weight: 800; color: #F2B544">[قیمت] روپے ماہانہ فی خاندان</span>
    </div>
    <span dir="ltr" style="width: 96px; height: 96px; border-radius: 12px; background: #FFFBF3; color: #1B2525; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; flex: none">[QR]</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":559,"height":794}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      alerts: [
        { ur: 'وین نکل گئی', t: '7:05', c: '#2747B8' },
        { ur: 'علی وین میں ہے', t: '7:12', c: '#0E7A3E' },
        { ur: 'اسکول پہنچ گئے', t: '7:46', c: '#1B2525' },
        { ur: 'علی کو گھر اتار دیا', t: '2:01', c: '#1E5C5A' }
      ]
    };
  }
}
</script>
</body>
</html>
