<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver mid-route v4</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
.one{height:52px;border:0;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 2px #FFFFFF;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;flex:1}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #1F2A5C; color: #FAF6EE; padding: 14px 16px; border-bottom: 5px solid #E8A33D; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.5"><span style="font-size: 21px; font-weight: 800">صبح کا چکر</span><span style="font-size: 14px; font-weight: 600">نکل گئے 7:05 · گلشن وین</span></div>
      <span style="font-size: 28px; font-weight: 800; line-height: 1">{{count}}/6</span>
      <a href="XD-Help.dc.html" style="height: 52px; padding: 0 14px; border-radius: 14px; background: #FAF6EE; color: #1F2A5C; text-decoration: none; display: flex; align-items: center; font-size: 16px; font-weight: 800">مدد</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px">
    <sc-for list="{{done}}" as="k" hint-placeholder-count="2">
      <div data-component="ChildRow" data-state="done" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: #DCEFE7; border-radius: 14px">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: #17705A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
        <span style="flex: 1; font-size: 18px; font-weight: 700">{{k.name}}</span><span style="font-size: 16px; font-weight: 800">{{k.t}}</span>
      </div>
    </sc-for>

    <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
      <section data-component="TapButton" data-step="picked" data-siblings="true" style="background: #17705A; color: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 5px 0 #0B4A3D">
        <span style="font-size: 14px; font-weight: 700">اسٹاپ 3 · ایک ہی گھر</span>
        <span style="font-size: 26px; font-weight: 800; line-height: 1.4">{{pair}}</span>
        <button onClick="{{both}}" style="height: 64px; border: 0; border-radius: 16px; background: #FFFFFF; color: #0B4A3D; font-family: inherit; font-size: 19px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#17705A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M2 21v-1a6 6 0 0 1 6-6h3 M14.5 18l2.5 2.5 5-5"></path></svg>{{bothLabel}}
        </button>
        <sc-if value="{{showOnes}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; gap: 8px">
            <sc-for list="{{ones}}" as="o" hint-placeholder-count="2"><button class="one" onClick="{{o.tap}}">صرف {{o.name}}</button></sc-for>
          </div>
        </sc-if>
      </section>
    </sc-if>

    <sc-for list="{{waiting}}" as="k" hint-placeholder-count="2">
      <div data-component="ChildRow" data-state="pending" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; background: #FFFFFF; border-radius: 14px; box-shadow: inset 0 0 0 1px #E2DCCD">
        <span style="width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px #141A33; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">{{k.n}}</span>
        <span style="flex: 1; font-size: 19px; font-weight: 700">{{k.name}}</span>
      </div>
    </sc-for>

    <span style="font-size: 14px; font-weight: 700; color: #4A4F66; padding: 0 4px">بہن بھائی ایک ہی اسٹاپ پر ہوں تو ایک ٹیپ کافی۔ ہر گھر کو اپنے بچے کی خبر الگ جاتی ہے۔</span>
    <a href="XD-School.dc.html" data-component="TapButton" data-step="reached_school" data-hold="true" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 66px; border-radius: 16px; background: #FBEBCF; box-shadow: inset 0 0 0 2px #E8A33D; color: #141A33; text-decoration: none; font-size: 17px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#141A33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18 M5 21V10l7-4 7 4v11 M10 21v-5h4v5 M12 6V2l4 1.5L12 5"></path></svg>
      اسکول پہنچ گئے · دبا کر رکھیں
    </a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { got: [] }; }
  renderVals() {
    const pair = ['حمزہ', 'عائشہ'];
    const got = this.state.got;
    const left = pair.filter((n) => !got.includes(n));
    const done = [{ name: 'علی', t: '7:12' }, { name: 'فاطمہ', t: '7:18' }].concat(got.map((n) => ({ name: n, t: '7:24' })));
    return {
      done,
      count: done.length,
      open: left.length > 0,
      pair: left.join(' اور '),
      bothLabel: left.length > 1 ? 'دونوں بٹھا لیے · ایک ٹیپ' : left[0] + ' کو بٹھا لیا',
      both: () => this.setState({ got: pair }),
      showOnes: left.length > 1,
      ones: left.map((n) => ({ name: n, tap: () => this.setState({ got: got.concat([n]) }) })),
      waiting: [{ n: 4, name: 'زین' }, { n: 5, name: 'مریم' }]
    };
  }
}
</script>
</body>
</html>
