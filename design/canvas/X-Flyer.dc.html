<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Flyer A5 v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400}
.pr{display:flex;justify-content:space-between;align-items:center;min-height:32px;border-bottom:1px solid #F0EBE0;font-size:17px;font-weight:700}
.pr:last-child{border-bottom:0}
</style>
</helmet>
<div dir="rtl" style="width: 559px; height: 794px; box-sizing: border-box; overflow: hidden; position: relative; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column">
  <div style="position: relative; background: #1F2A5C; color: #FAF6EE; padding: 30px 36px 26px; overflow: hidden; flex: none">
    <svg width="559" height="240" aria-hidden="true" style="position: absolute; inset: 0"><defs><pattern id="fp" width="48" height="48" patternUnits="userSpaceOnUse"><path transform="translate(7 7) scale(0.53)" d="{{S}}" fill="#2B3A80"></path><circle cx="24" cy="24" r="2.8" fill="#E8A33D"></circle></pattern></defs><rect width="559" height="240" fill="url(#fp)"></rect></svg>
    <div style="position: relative; display: flex; flex-direction: column">
      <span style="display: flex; align-items: center; gap: 10px"><svg width="93" height="48" viewBox="0 0 124 64" aria-hidden="true"><path d="{{S}}" fill="#E8A33D"></path><circle cx="32" cy="32" r="9" fill="#1F2A5C"></circle><circle cx="74" cy="32" r="5" fill="#E8A33D"></circle><circle cx="88" cy="32" r="3" fill="#E8A33D"></circle><circle cx="98" cy="32" r="3" fill="#E8A33D"></circle><circle cx="114" cy="32" r="6" fill="#A7D47E"></circle></svg><span class="disp" style="font-size: 46px; line-height: 1.4">پہنچ</span></span>
      <span class="disp" style="font-size: 54px; line-height: 1.55">فکر کم، خبر پوری</span>
      <span style="font-size: 18px; font-weight: 700">اسکول وین کی ہر خبر، آپ کے فون پر</span>
    </div>
  </div>
  <main style="flex: 1; padding: 18px 36px 22px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 44px; height: 44px; position: relative; display: flex; align-items: center; justify-content: center; flex: none"><svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true" style="position: absolute; inset: 0"><path d="{{S}}" fill="{{s.c}}"></path></svg><span style="position: relative; font-size: 18px; font-weight: 800; color: {{s.fg}}">{{s.n}}</span></span>
        <span style="display: flex; flex-direction: column; line-height: 1.4"><span style="font-size: 19px; font-weight: 800">{{s.t}}</span><span style="font-size: 15px; font-weight: 600">{{s.d}}</span></span>
      </div>
    </sc-for>
    <div style="background: #FFFFFF; border-radius: 8px; box-shadow: inset 0 0 0 1.5px #C9A24A, inset 0 0 0 6px #FFFFFF, inset 0 0 0 7px #E2DCCD; padding: 10px 22px">
      <div class="pr"><span>پہلا مہینہ</span><span style="color: #17705A; font-weight: 800">مفت</span></div>
      <div class="pr"><span>ماہانہ، ہر بچہ</span><span>Rs 199</span></div>
      <div class="pr"><span>سالانہ (2 مہینے مفت)</span><span>Rs 1,990</span></div>
      <div class="pr"><span>دوسرا بچہ</span><span>Rs 99</span></div>
      <div class="pr"><span>جون، جولائی</span><span>کوئی پیسہ نہیں</span></div>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 16px">
      <span style="width: 96px; height: 96px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #141A33; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex: none">[QR]</span>
      <span style="font-size: 16px; font-weight: 700; line-height: 1.6">اپنی وین کے کیپٹن سے لنک مانگیں، یا اسکین کر کے نئی وین بنائیں۔ وین فیس الگ ہے، ڈرائیور کو ہی جاتی ہے۔</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":559,"height":794}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      S: 'M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z',
      steps: [
        { n: 1, c: '#1F2A5C', fg: '#FAF6EE', t: 'لنک کھولیں', d: 'کوئی ایپ اسٹور نہیں، کوئی پاس ورڈ نہیں' },
        { n: 2, c: '#E8A33D', fg: '#141A33', t: 'بچے کا پہلا نام چنیں', d: 'کیپٹن آپ کا نمبر منظور کریں گے' },
        { n: 3, c: '#17705A', fg: '#FFFFFF', t: 'اطلاعات آن کریں', d: 'وین نکلی، بچہ وین میں، اسکول پہنچے' }
      ]
    };
  }
}
</script>
</body>
</html>
