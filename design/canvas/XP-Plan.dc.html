<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Parent plan and pay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.55}
.plan{border:0;border-radius:16px;font-family:inherit;text-align:right;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pay{height:56px;border-radius:14px;border:0;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 900px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column; padding: 20px 16px 16px; gap: 12px">
  <span class="disp" style="font-size: 36px">آپ کا پلان</span>
  <div style="background: #1F2A5C; color: #FAF6EE; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="#E8A33D"></path></svg>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.4"><span style="font-size: 18px; font-weight: 800">مفت مہینہ · 21 دن باقی</span><span style="font-size: 14px; font-weight: 600">پہلی ادائیگی 18 نومبر کو</span></span>
  </div>

  <span style="font-size: 16px; font-weight: 800">پلان چنیں · علی</span>
  <sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
    <button class="plan" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="background: {{p.bg}}; box-shadow: {{p.ring}}; color: #141A33">
      <span style="width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 {{p.dot}} #1F2A5C; flex: none"></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.4"><span style="font-size: 18px; font-weight: 800">{{p.name}}</span><span style="font-size: 14px; font-weight: 600; color: #4A4F66">{{p.note}}</span></span>
      <span style="font-size: 22px; font-weight: 800">{{p.price}}</span>
    </button>
  </sc-for>
  <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 14px; box-shadow: inset 0 0 0 1px #E2DCCD; padding: 10px 14px">
    <span style="flex: 1; font-size: 15px; font-weight: 700">دوسرا بچہ؟ صرف Rs 99 ماہانہ</span>
    <a href="XP-Siblings.dc.html" style="font-size: 15px; font-weight: 800">شامل کریں</a>
  </div>

  <span style="font-size: 16px; font-weight: 800">کیسے دیں گے؟</span>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
      <button class="pay" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="background: {{m.bg}}; color: {{m.fg}}; box-shadow: {{m.ring}}">{{m.label}}</button>
    </sc-for>
  </div>
  <span style="font-size: 14px; font-weight: 600; color: #4A4F66">{{methodNote}}</span>

  <div style="margin-top: auto; background: #FBEBCF; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 15px; font-weight: 800">18 نومبر کو</span><span style="font-size: 24px; font-weight: 800">{{total}}</span>
  </div>
  <button style="height: 62px; border-radius: 16px; border: 0; background: #1F2A5C; color: #FAF6EE; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">پلان پکا کریں</button>
  <span style="font-size: 14px; font-weight: 600; text-align: center; color: #4A4F66">جون اور جولائی میں کوئی پیسہ نہیں۔ جب چاہیں بند کریں۔</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { plan: 'year', method: 'raast' }; }
  renderVals() {
    const s = this.state;
    const plans = [
      { id: 'month', name: 'ماہانہ', note: 'ہر مہینے، صرف اسکول کے مہینوں میں', price: 'Rs 199' },
      { id: 'year', name: 'سالانہ · 2 مہینے مفت', note: '12 مہینے، 10 کی قیمت', price: 'Rs 1,990' }
    ];
    const methods = [
      { id: 'raast', label: 'راست QR', note: 'کسی بھی بینک ایپ سے راست QR اسکین کریں۔ کوئی فیس نہیں۔' },
      { id: 'jazz', label: 'JazzCash', note: 'JazzCash ایپ میں درخواست آئے گی، منظور کریں۔' },
      { id: 'easy', label: 'Easypaisa', note: 'Easypaisa ایپ میں درخواست آئے گی، منظور کریں۔' },
      { id: 'card', label: 'بینک ایپ', note: 'کسی بھی بینک ایپ سے پہنچ کے IBAN پر بھیجیں، حوالہ نمبر کے ساتھ۔' }
    ];
    const m = methods.find((x) => x.id === s.method);
    return {
      plans: plans.map((p) => {
        const on = p.id === s.plan;
        return { ...p, on, bg: on ? '#FFFFFF' : '#FAF6EE', ring: on ? 'inset 0 0 0 2.5px #1F2A5C' : 'inset 0 0 0 1.5px #E2DCCD', dot: on ? '7px' : '2px', pick: () => this.setState({ plan: p.id }) };
      }),
      methods: methods.map((x) => {
        const on = x.id === s.method;
        return { ...x, on, bg: on ? '#1F2A5C' : '#FFFFFF', fg: on ? '#FAF6EE' : '#141A33', ring: on ? 'none' : 'inset 0 0 0 1.5px #E2DCCD', pick: () => this.setState({ method: x.id }) };
      }),
      methodNote: m.note,
      total: s.plan === 'year' ? 'Rs 1,990' : 'Rs 199'
    };
  }
}
</script>
</body>
</html>
