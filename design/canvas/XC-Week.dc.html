<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Captain driver week v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2A5C}a:hover{color:#2B3A80}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.55}
.day{border:0;border-radius:14px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:8px 0;height:150px}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column; padding: 20px 16px 16px; gap: 12px">
  <span class="disp" style="font-size: 36px">رفیق بھائی کا ہفتہ</span>
  <div style="display: flex; gap: 8px; margin-top: -6px">
    <span style="flex: 1; background: #DCEFE7; border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 26px; font-weight: 800; color: #0B4A3D">96%</span><span style="font-size: 14px; font-weight: 700">30 دن کا بھروسہ</span></span>
    <span style="flex: 1; background: #F6DDD6; border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 26px; font-weight: 800; color: #9E2A1F">1</span><span style="font-size: 14px; font-weight: 700">اس ہفتے کی کمی</span></span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px" role="group" aria-label="ہفتے کے دن">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="5">
      <button class="day" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="background: {{d.bg}}; box-shadow: {{d.ring}}">
        <span style="width: 28px; height: {{d.h}}px; border-radius: 8px; background: {{d.bar}}"></span>
        <span style="font-size: 15px; font-weight: 800; color: #141A33">{{d.pct}}</span>
        <span style="font-size: 14px; font-weight: 700; color: #141A33">{{d.name}}</span>
      </button>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border-radius: 18px; box-shadow: inset 0 0 0 1.5px #C9A24A, inset 0 0 0 5px #FFFFFF, inset 0 0 0 6px #E2DCCD; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 17px; font-weight: 800">{{sel.title}}</span>
    <sc-for list="{{sel.lines}}" as="l" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; min-height: 32px">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: {{l.c}}; flex: none"></span><span style="flex: 1">{{l.t}}</span>
      </div>
    </sc-for>
  </div>

  <span style="font-size: 14px; font-weight: 600; color: #4A4F66">کمی = کوئی قدم ٹیپ نہیں ہوا اور کسی والدین نے پوچھا۔ صرف آپ اور پہنچ دیکھتے ہیں۔ ماہانہ بھروسہ 90% یا زیادہ ہو تو ڈرائیور کو ہر ادا بچے پر Rs 40 ملتے ہیں۔</span>
  <button style="margin-top: auto; height: 60px; border-radius: 16px; border: 0; background: #E8A33D; color: #141A33; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">رفیق بھائی کو شکریہ بھیجیں</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 2 }; }
  renderVals() {
    const ok = '#17705A', miss = '#A8321F', late = '#E8A33D';
    const days = [
      { name: 'پیر', v: 100, title: 'پیر · سب ٹیپ وقت پر', lines: [{ c: ok, t: 'صبح: 5 میں سے 5 قدم' }, { c: ok, t: 'دوپہر: 5 میں سے 5 قدم' }] },
      { name: 'منگل', v: 100, title: 'منگل · سب ٹیپ وقت پر', lines: [{ c: ok, t: 'صبح: 5 میں سے 5' }, { c: ok, t: 'دوپہر: 5 میں سے 5' }] },
      { name: 'بدھ', v: 80, title: 'بدھ · ایک کمی', lines: [{ c: ok, t: 'صبح: سب قدم ٹھیک' }, { c: miss, t: '"اسکول سے نکلے" ٹیپ نہیں ہوا · 2 والدین نے پوچھا' }, { c: ok, t: '"گھر چھوڑ دیا" سب کے لیے ہوا' }] },
      { name: 'جمعرات', v: 95, title: 'جمعرات · ایک دیر سے', lines: [{ c: late, t: '"وین نکل گئی" 9 منٹ دیر سے، ٹریفک بتایا' }, { c: ok, t: 'باقی سب وقت پر' }] },
      { name: 'جمعہ', v: 0, title: 'جمعہ · اسکول کی چھٹی', lines: [{ c: '#5E5A52', t: 'کیپٹن نے پوری وین کی چھٹی لگائی' }] }
    ];
    const s = days[this.state.day];
    return {
      sel: s,
      days: days.map((d, i) => {
        const on = i === this.state.day, off = d.v === 0;
        return {
          ...d, on, pct: off ? 'چھٹی' : d.v + '%', h: off ? 8 : Math.round(d.v * 0.7),
          bar: off ? '#C9C2B4' : d.v >= 100 ? ok : d.v >= 90 ? late : miss,
          bg: on ? '#FFFFFF' : '#F3EEE3', ring: on ? 'inset 0 0 0 2.5px #1F2A5C' : 'none',
          pick: () => this.setState({ day: i })
        };
      })
    };
  }
}
</script>
</body>
</html>
