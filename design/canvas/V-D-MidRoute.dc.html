<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver mid-route v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5C5A}a:hover{color:#123C3B}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #F6EFE2; color: #1B2525; font-family: Nunito, 'Noto Nastaliq Urdu', sans-serif; line-height: 1.9; display: flex; flex-direction: column">
  <header data-component="TripHeader" style="background: #1E5C5A; color: #F6EFE2; border-radius: 0 0 28px 28px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.7"><span style="font-size: 21px; font-weight: 700">صبح کا چکر</span><span style="font-size: 14px; font-weight: 600">نکل گئے 7:05 · گلشن وین</span></div>
      <span style="font-size: 28px; font-weight: 900; line-height: 1">3/5</span>
      <a href="V-D-Safety.dc.html" style="height: 52px; padding: 0 14px; border-radius: 18px; background: #F6EFE2; color: #1E5C5A; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E5C5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>مدد</a>
    </div>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
        <span style="width: 16px; height: 16px; border-radius: 50%; background: {{d.fill}}; border: 3px solid {{d.ring}}; box-sizing: border-box; flex: none"></span>
        <span style="flex: 1; border-top: 3px dotted #F6EFE2"></span>
      </sc-for>
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2525" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18 M5 21V10l7-4 7 4v11 M10 21v-5h4v5"></path></svg></span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px">
    <div style="display: flex; gap: 8px">
      <span data-component="AbsentChip" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; background: #EDE3D0; color: #5C5348; font-size: 16px; font-weight: 700">مریم · آج چھٹی</span>
    </div>
    <sc-for list="{{done}}" as="k" hint-placeholder-count="3">
      <div data-component="ChildRow" data-state="done" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; background: #FFFBF3; border-radius: 16px">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: #0E7A3E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
        <span style="flex: 1; font-size: 18px; font-weight: 700">{{k.name}}</span>
        <span style="font-size: 16px; font-weight: 800">{{k.t}}</span>
      </div>
    </sc-for>

    <a href="V-D-Undo.dc.html" data-component="TapButton" data-step="picked" data-size="next" style="display: flex; align-items: center; gap: 14px; height: 108px; padding: 0 18px; border-radius: 26px; background: #0E7A3E; color: #FFFFFF; text-decoration: none; box-shadow: 0 5px 0 #075027">
      <span style="width: 62px; height: 62px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0E7A3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M2 21v-1a6 6 0 0 1 6-6h3 M14.5 18l2.5 2.5 5-5"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.6"><span style="font-size: 28px; font-weight: 700">عائشہ</span><span style="font-size: 17px; font-weight: 700">بٹھا لیا · ایک ٹیپ</span></span>
      <span style="width: 38px; height: 38px; border-radius: 50%; border: 3px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900; box-sizing: border-box">4</span>
    </a>

    <button data-component="ChildRow" data-state="waiting" style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; background: #FFFBF3; border: 3px solid #0E7A3E; border-radius: 18px; color: #1B2525; font-family: inherit; text-align: right; cursor: pointer">
      <span style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid #1B2525; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; box-sizing: border-box">5</span>
      <span style="flex: 1; font-size: 19px; font-weight: 700">زین</span>
      <span style="font-size: 16px; font-weight: 700; color: #0E7A3E">بٹھا لیا</span>
    </button>

    <a href="V-D-School.dc.html" data-component="TapButton" data-step="reached_school" data-size="later" data-hold="true" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 66px; border-radius: 22px; border: 3px solid #1B2525; color: #1B2525; text-decoration: none; font-size: 19px; font-weight: 700; box-sizing: border-box">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B2525" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18 M5 21V10l7-4 7 4v11 M10 21v-5h4v5 M12 6V2l4 1.5L12 5"></path></svg>
      اسکول پہنچ گئے · دبا کر رکھیں
    </a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (done) => ({ fill: done ? '#F2B544' : 'transparent', ring: done ? '#F2B544' : '#F6EFE2' });
    return {
      dots: [dot(true), dot(true), dot(true), dot(false), dot(false)],
      done: [{ name: 'علی', t: '7:12' }, { name: 'فاطمہ', t: '7:18' }, { name: 'حمزہ', t: '7:24' }]
    };
  }
}
</script>
</body>
</html>
