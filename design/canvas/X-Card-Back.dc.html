<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Driver card back v3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 559px; height: 397px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; padding: 22px 32px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 2px #C9A24A, inset 0 0 0 10px #FAF6EE, inset 0 0 0 11px #E2DCCD">
  <span style="font-size: 18px; font-weight: 800">روز کے 5 ٹیپ · وین رکی ہو تب</span>
  <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 40px">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex: none">{{s.n}}</span>
      <span style="flex: 1; font-size: 17px; font-weight: 800">{{s.t}}</span>
      <span style="font-size: 14px; font-weight: 700; color: #4A4F66">{{s.how}}</span>
    </div>
  </sc-for>
  <span style="margin-top: auto; font-size: 15px; font-weight: 700; background: #FBEBCF; border-radius: 10px; padding: 6px 12px">غلط ٹیپ؟ 5 سیکنڈ میں "واپس" دبائیں۔ مدد: [نمبر]</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":559,"height":397}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { n: 1, t: 'وین نکل گئی', how: 'دبا کر رکھیں', bg: '#1F2A5C', fg: '#FAF6EE' },
        { n: 2, t: 'بچہ وین میں', how: 'ہر بچے کا نام', bg: '#17705A', fg: '#FFFFFF' },
        { n: 3, t: 'اسکول پہنچ گئے', how: 'دبا کر رکھیں', bg: '#E8A33D', fg: '#141A33' },
        { n: 4, t: 'اسکول سے نکلے', how: 'دبا کر رکھیں', bg: '#A8321F', fg: '#FFFFFF' },
        { n: 5, t: 'گھر چھوڑ دیا', how: 'ہر بچے کا نام', bg: '#A7D47E', fg: '#141A33' }
      ]
    };
  }
}
</script>
</body>
</html>
