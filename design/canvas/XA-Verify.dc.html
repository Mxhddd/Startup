<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<title>Amaan verification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5E4E}a:hover{color:#17705A}
.disp{font-family:Gulzar,'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.55}
</style>
</helmet>
<div dir="rtl" style="width: 360px; height: 780px; box-sizing: border-box; overflow: hidden; background: #FAF6EE; color: #141A33; font-family: Manrope, 'Noto Sans Arabic', sans-serif; line-height: 1.6; display: flex; flex-direction: column; padding: 20px 16px 16px; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="#0F5E4E" stroke="#C9A24A" stroke-width="2"></path><text x="32" y="38" text-anchor="middle" font-family="Manrope, sans-serif" font-size="18" font-weight="800" fill="#FAF6EE">{{done}}/5</text></svg>
    <span style="display: flex; flex-direction: column; line-height: 1.4"><span class="disp" style="font-size: 30px">شازیہ صاحبہ</span><span style="font-size: 15px; font-weight: 700; color: #0F5E4E">{{headline}}</span></span>
  </div>

  <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <li style="display: flex; gap: 12px; min-height: 84px">
        <span style="display: flex; flex-direction: column; align-items: center; flex: none">
          <span style="width: 36px; height: 36px; border-radius: 50%; background: {{s.bg}}; color: {{s.fg}}; box-shadow: {{s.ring}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">
            <sc-if value="{{s.ok}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FAF6EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
            <sc-if value="{{s.notOk}}" hint-placeholder-val="{{ false }}">{{s.n}}</sc-if>
          </span>
          <span style="flex: 1; width: 3px; background: {{s.line}}; margin: 4px 0"></span>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.5; padding-top: 4px">
          <span style="font-size: 17px; font-weight: 800">{{s.t}}</span>
          <span style="font-size: 14px; font-weight: 600; color: #4A4F66">{{s.d}}</span>
        </span>
        <span style="font-size: 14px; font-weight: 800; color: {{s.stColor}}; padding-top: 8px">{{s.st}}</span>
      </li>
    </sc-for>
  </ol>

  <button onClick="{{next}}" style="margin-top: auto; height: 62px; border-radius: 16px; border: 0; background: #0F5E4E; color: #FAF6EE; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">{{btn}}</button>
  <span style="font-size: 14px; font-weight: 600; text-align: center; color: #4A4F66">کاغذات صرف تصدیق کے لیے، کسی والدین کو نہیں دکھائے جاتے۔</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: 3 }; }
  renderVals() {
    const list = [
      { t: 'شناختی کارڈ', d: 'نادرا سے تصدیق' },
      { t: 'لائسنس', d: 'LTV یا کار، مدت باقی' },
      { t: 'دو حوالے', d: 'اسکول، مسجد، محلہ کمیٹی یا پچھلا کام' },
      { t: 'تربیت', d: 'آدھا دن: ایپ، بچوں کی حفاظت، فرسٹ ایڈ' },
      { t: 'گھر کا دورہ', d: 'ہماری ٹیم کی دو خواتین آئیں گی' }
    ];
    const d = this.state.done;
    return {
      done: d,
      headline: d >= 5 ? 'امان مہر مل گئی' : d + ' مرحلے مکمل · ' + (5 - d) + ' باقی',
      btn: d >= 5 ? 'وین کی لسٹنگ دیکھیں' : 'اگلا مرحلہ مکمل دکھائیں',
      next: () => this.setState({ done: d >= 5 ? 3 : d + 1 }),
      steps: list.map((s, i) => {
        const ok = i < d, cur = i === d;
        return {
          ...s, n: i + 1, ok, notOk: !ok,
          bg: ok ? '#0F5E4E' : cur ? '#FBEBCF' : '#FFFFFF', fg: ok ? '#FAF6EE' : '#141A33',
          ring: ok ? 'none' : cur ? 'inset 0 0 0 2.5px #E8A33D' : 'inset 0 0 0 1.5px #E2DCCD',
          line: i === list.length - 1 ? 'transparent' : ok ? '#0F5E4E' : '#E2DCCD',
          st: ok ? 'ہو گیا' : cur ? 'جاری' : 'باقی', stColor: ok ? '#0F5E4E' : cur ? '#8A5A12' : '#5E5A52'
        };
      })
    };
  }
}
</script>
</body>
</html>
