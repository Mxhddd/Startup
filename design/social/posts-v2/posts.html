<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pohnch posts v2</title>
<!-- Feed posts v2 (4:5, 1080 x 1350): the relatable set that goes with the reels. Open posts.html#<id>;
     make.cjs renders each to PNG and writes the same markup as a canvas artboard (.dc.html). -->
<style id="css">
  @font-face{font-family:Caveat;font-weight:700;src:url(../../video/reels/fonts/Caveat-wght-700.woff2)}
  @font-face{font-family:Manrope;font-weight:500;src:url(../../video/reels/fonts/Manrope-wght-500.woff2)}
  @font-face{font-family:Manrope;font-weight:700;src:url(../../video/reels/fonts/Manrope-wght-700.woff2)}
  @font-face{font-family:Manrope;font-weight:800;src:url(../../video/reels/fonts/Manrope-wght-800.woff2)}
  @font-face{font-family:Gulzar;src:url(../../video/reels/fonts/Gulzar.ttf)}
  html,body{margin:0}
  .post{position:relative;width:1080px;height:1350px;box-sizing:border-box;overflow:hidden;font-family:Manrope,'Noto Color Emoji',sans-serif;color:#141A33;
    background:radial-gradient(circle at 22px 22px,#D8CDB6 2.2px,transparent 2.6px) 0 0/44px 44px,#F4EEE1;padding:110px 96px;display:flex;flex-direction:column}
  .post::before{content:"";position:absolute;left:64px;top:0;bottom:0;border-left:2.5px solid rgba(231,185,166,.7)}
  .post.dark{background:#1F2A5C;color:#FBF7EF}
  .post.dark::before{display:none}
  .kick{font-size:36px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7A5410}
  .dark .kick{color:#E8A33D}
  .h{font-size:92px;font-weight:800;line-height:1.06;letter-spacing:-2px;margin-top:22px}
  .hand{font-family:Caveat,cursive;font-weight:700}
  .sub{font-family:Caveat,cursive;font-weight:700;font-size:70px;color:#1F2A5C;line-height:1.1;margin-top:26px}
  .dark .sub{color:#E8A33D}
  .card{background:#FFFDF8;border:5px solid #23284A;border-radius:32px;padding:30px 38px;box-shadow:9px 11px 0 #23284A}
  .row{display:flex;flex-direction:column;gap:6px}
  .row .a{font-size:58px;font-weight:800}
  .row .a s{text-decoration-thickness:7px;text-decoration-color:#C2185B}
  .row .b{font-family:Caveat,cursive;font-weight:700;font-size:78px;color:#17705A;line-height:1.05}
  .stack{display:flex;flex-direction:column;gap:40px;margin-top:60px}
  .swipe{position:absolute;right:96px;bottom:84px;font-family:Caveat,cursive;font-weight:700;font-size:60px;color:#1F2A5C}
  .dark .swipe{color:#E8A33D}
  .foot{position:absolute;left:96px;right:96px;bottom:80px;display:flex;justify-content:space-between;align-items:center;font-size:34px;font-weight:800}
  .foot .u{font-family:Gulzar,serif;font-size:58px;color:#E8A33D;font-weight:400}
  .bub{align-self:flex-start;background:#fff;border-radius:10px 40px 40px 40px;padding:20px 32px;box-shadow:0 4px 0 rgba(0,0,0,.08);max-width:80%}
  .bub .n{font-size:30px;font-weight:800;color:#C2185B}
  .bub .x{font-size:52px;font-weight:700;line-height:1.25}
  .bub .t{font-size:26px;color:#8A8F9C;text-align:right;font-weight:700}
  .li{display:flex;gap:26px;align-items:center;font-size:44px;font-weight:800;line-height:1.2}
  .li .n{flex:none;width:84px;height:84px;border-radius:50%;background:#E8A33D;border:5px solid #23284A;display:grid;place-items:center;font-family:Caveat,cursive;font-size:64px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:70px}
  .opt{text-align:center;padding:44px 20px}
  .opt .e{font-size:150px;line-height:1.1}
  .opt b{display:block;font-size:56px;margin-top:14px}
  .opt small{display:block;font-family:Caveat,cursive;font-weight:700;font-size:54px;color:#17705A;margin-top:8px}
  .stat{display:flex;align-items:baseline;gap:26px;border-bottom:3px dashed rgba(251,247,239,.25);padding:12px 0}
  .stat b{font-size:82px;font-weight:800;color:#E8A33D;min-width:300px;letter-spacing:-2px}
  .stat span{font-size:44px;font-weight:700}
  .note{display:flex;gap:24px;align-items:center;background:rgba(250,248,243,.95);color:#141A33;border-radius:44px;padding:28px 32px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
  .note .ic{width:96px;height:96px;border-radius:24px;background:#1F2A5C;display:grid;place-items:center;flex:none}
  .note .meta{display:flex;justify-content:space-between;font-size:26px;font-weight:700;color:#666B7D}
  .note b{display:block;font-size:44px;line-height:1.25}
  .note span{display:block;font-size:32px;font-weight:600;color:#555A6E}
</style>
</head>
<body>
<div id="root"></div>
<script>
const STAR='<svg width="64" height="64" viewBox="0 0 64 64"><path d="M32 4 L40.2 12.2 L51.8 12.2 L51.8 23.8 L60 32 L51.8 40.2 L51.8 51.8 L40.2 51.8 L32 60 L23.8 51.8 L12.2 51.8 L12.2 40.2 L4 32 L12.2 23.8 L12.2 12.2 L23.8 12.2 Z" fill="#E8A33D"/><circle cx="32" cy="32" r="7" fill="#1F2A5C"/></svg>';
const FOOT=(t)=>`<div class="foot"><span>${t||'pohnch.pk'}</span><span class="u">پہنچ</span></div>`;
const POSTS={
  dict1:`<div class="post"><div class="kick">a translation guide 📖</div><div class="h">Van Uncle → English</div><div class="sub">save this for 7 AM tomorrow 📌</div>
    <div class="stack" style="margin-top:90px"><div class="card row" style="transform:rotate(-2deg);padding:44px 48px"><div class="a" style="font-size:80px"><s>"5 minute"</s></div><div class="b" style="font-size:110px">= 25 minute</div></div></div><div style="font-size:220px;margin-top:60px;transform:scaleX(-1);align-self:flex-end">🚐</div>
    <div class="swipe">swipe →</div></div>`,
  dict2:`<div class="post"><div class="stack" style="margin-top:20px">
    <div class="card row" style="transform:rotate(1.5deg)"><div class="a"><s>"Bas nikal gaya"</s></div><div class="b">chai ka aakhri ghoont</div></div>
    <div class="card row" style="transform:rotate(-1.5deg)"><div class="a"><s>"Raste mein hoon"</s></div><div class="b">abhi ghar pe hai</div></div>
    <div class="card row" style="transform:rotate(1deg)"><div class="a"><s>"Neeche aa jao"</s></div><div class="b">gali ke kone pe hai</div></div></div><div class="swipe">→</div></div>`,
  dict3:`<div class="post"><div class="stack" style="margin-top:20px">
    <div class="card row" style="transform:rotate(-1deg)"><div class="a"><s>"Traffic hai"</s></div><div class="b">sach mein. Shahrah-e-Faisal 😭</div></div>
    <div class="card row" style="transform:rotate(1.5deg)"><div class="a"><s>"Aaj thora late"</s></div><div class="b">aaj bohat late</div></div></div>
    <div class="hand" style="font-size:72px;color:#1F2A5C;margin-top:70px;line-height:1.15">We love you, Van Uncle ❤️<br>but we want the real minutes.</div><div class="swipe">→</div></div>`,
  dict4:`<div class="post dark"><div class="kick">so we built this</div><div class="h">Real minutes. Live.</div><div class="sub">no calls, no guessing</div>
    <div style="margin-top:110px;display:flex;flex-direction:column;gap:26px">
    <div class="note"><div class="ic">${STAR}</div><div style="flex:1"><div class="meta"><span>POHNCH</span><span>now</span></div><b>The van is 12 min away</b><span>live on the map · Van 1</span></div></div>
    <div class="note"><div class="ic">${STAR}</div><div style="flex:1"><div class="meta"><span>POHNCH</span><span>now</span></div><b>Sara got in the van ✓</b><span>7:12 · Uncle tapped once</span></div></div></div>
    ${FOOT('tag your van uncle 😂 · pohnch.pk')}</div>`,
  number:`<div class="post"><div class="kick">nostalgia</div><div class="h" style="font-size:72px">Things EVERY Karachi school van had</div>
    <div class="stack" style="gap:20px;margin-top:44px">
    <div class="li"><span class="n">1</span><span style="flex:1">The kid who ALWAYS got the front seat</span>💺</div>
    <div class="li"><span class="n">2</span><span style="flex:1">A mountain of bags at the back</span>🎒</div>
    <div class="li"><span class="n">3</span><span style="flex:1">Uncle's FM. His song, his rules</span>📻</div>
    <div class="li"><span class="n">4</span><span style="flex:1">The door that needed two kids</span>🚪</div>
    <div class="li"><span class="n">5</span><span style="flex:1">Tasbeeh swinging on the mirror</span>📿</div>
    <div class="li"><span class="n">6</span><span style="flex:1">The kid who slept the whole way</span>😴</div></div>
    <div class="hand" style="font-size:64px;color:#C2185B;margin-top:30px">comment your score /6 👇</div></div>`,
  tag:`<div class="post"><div class="kick">every class group has one</div><div class="h" style="font-size:84px">Tag the mom who sends this first. Every. Morning.</div>
    <div style="margin-top:90px;display:flex;flex-direction:column;gap:22px;transform:rotate(-2deg)">
    <div class="bub"><div class="n">Ayesha</div><div class="x">Van aa gayi kisi ki?? 😩</div><div class="t">7:09</div></div>
    <div class="bub"><div class="n" style="color:#1F5E54">Sana</div><div class="x">Nahi abhi tak</div><div class="t">7:09</div></div>
    <div class="bub"><div class="n" style="color:#7A5410">Hina</div><div class="x">Uncle phone nahi utha rahe</div><div class="t">7:10</div></div></div>
    ${FOOT('👇 tag her (with love)')}</div>`,
  firstlast:`<div class="post"><div class="kick">settle this</div><div class="h">First pickup or last pickup?</div><div class="sub">there is no in-between</div>
    <div class="two"><div class="card opt" style="transform:rotate(-2deg)"><div class="e">🌅</div><b>First</b><small>saw every sunrise</small></div>
    <div class="card opt" style="transform:rotate(2deg)"><div class="e">😴</div><b>Last</b><small>slept till 7:20</small></div></div>
    ${FOOT('comment 🌅 or 😴')}</div>`,
  week1:`<div class="post dark"><div class="kick">building Pohnch in public · week 1</div><div class="h" style="font-size:72px">Students in Karachi. One school-van problem.</div>
    <div style="margin-top:36px">
    <div class="stat"><b>1,368</b><span>views on our first reel</span></div>
    <div class="stat"><b>2,000</b><span>brochures printed</span></div>
    <div class="stat"><b>8</b><span>standees going up in Karachi</span></div>
    <div class="stat"><b>1</b><span>school demo booked</span></div>
    <div class="stat" style="border:0"><b>0</b><span>rupees from drivers. Ever.</span></div></div>
    ${FOOT('Pohnch · school van, live · Karachi')}</div>`,
  ask:`<div class="post"><div class="kick">Karachi parents</div><div class="h">How do you know your child is in the van?</div>
    <div class="stack" style="gap:26px;margin-top:70px">
    <div class="card" style="font-size:50px;font-weight:800">A · I call Uncle 📞</div>
    <div class="card" style="font-size:50px;font-weight:800">B · The class group 💬</div>
    <div class="card" style="font-size:50px;font-weight:800">C · I just… hope 🙏</div></div>
    ${FOOT('comment A, B or C 👇')}</div>`,
};
const id=(location.hash||'#dict1').slice(1);
document.getElementById('root').innerHTML=POSTS[id];
window.IDS=Object.keys(POSTS);
</script>
</body>
</html>
