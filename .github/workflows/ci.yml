# Runs on every push: type check, unit tests, website build and website tests.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start Postgres with PostGIS and pgTAP for the database tests
        # Uses whichever Postgres version this Ubuntu ships with pgTAP, so it keeps working when GitHub
        # moves to a newer Ubuntu. (Locally the tests run on Postgres 16; the migrations are the same.)
        run: |
          sudo apt-get update -q
          PGV=$(apt-cache search --names-only '^postgresql-[0-9]+-pgtap$' | sed -E 's/^postgresql-([0-9]+)-pgtap.*/\1/' | sort -n | tail -1)
          echo "Using Postgres $PGV"
          sudo apt-get install -y -q "postgresql-$PGV" "postgresql-$PGV-postgis-3" "postgresql-$PGV-pgtap"
          sudo -u postgres "/usr/lib/postgresql/$PGV/bin/initdb" -D /tmp/pg -A trust -U postgres
          sudo -u postgres "/usr/lib/postgresql/$PGV/bin/pg_ctl" -D /tmp/pg -o "-p 54329 -k /tmp" -l /tmp/pg.log -w start
      - run: pnpm test:db
        env:
          DATABASE_URL: postgres://postgres@localhost:54329/postgres
      - run: pnpm build:web
      - run: pnpm --filter @pohnch/web exec playwright install --with-deps chromium
      - run: pnpm test:web
        env:
          CI: "true"
