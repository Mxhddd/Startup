# Runs on every push: type check, unit tests, website build and website tests.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm --filter @pohnch/web exec playwright install --with-deps chromium
      - run: pnpm test:web
        env:
          CI: "true"
