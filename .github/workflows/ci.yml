# Runs on every push: type check, unit tests, website build and website tests.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres 16 with PostGIS for the database tests (pgTAP is added in a step below).
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Add pgTAP to the database and psql to the runner
        run: |
          docker exec ${{ job.services.postgres.id }} sh -c "apt-get update -q && apt-get install -y -q postgresql-16-pgtap"
          command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)
      - run: pnpm test:db
        env:
          DATABASE_URL: postgres://postgres@localhost:54329/postgres
      - run: pnpm build:web
      - run: pnpm --filter @pohnch/web exec playwright install --with-deps chromium
      - run: pnpm test:web
        env:
          CI: "true"
